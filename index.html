<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clásico Deportivo 80s Ultra Realista 3D</title>
    <style>
        /* Reseteo y lienzo a pantalla completa sin barras de desplazamiento */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050608;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Dock minimalista flotante estilo showroom AAA con exactamente 3 botones */
        #controls-dock {
            position: fixed;
            left: 50%;
            bottom: max(18px, env(safe-area-inset-bottom, 18px));
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 9px;
            border-radius: 999px;
            background: rgba(12, 13, 17, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: 0 14px 38px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 20;
            max-width: calc(100vw - 24px);
        }
        .ctrl-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.09);
            background: rgba(255, 255, 255, 0.045);
            color: rgba(238, 240, 246, 0.86);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 15px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            white-space: nowrap;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.20);
            color: #ffffff;
        }
        .ctrl-btn:active {
            transform: scale(0.96);
        }
        .ctrl-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .ctrl-btn .led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            transition: background 0.25s ease, box-shadow 0.25s ease;
            flex-shrink: 0;
        }
        .ctrl-btn.active {
            background: rgba(212, 24, 32, 0.24);
            border-color: rgba(255, 78, 84, 0.62);
            color: #ffffff;
            box-shadow: 0 0 18px rgba(220, 28, 36, 0.28);
        }
        .ctrl-btn.active .led {
            background: #ff4248;
            box-shadow: 0 0 9px #ff4248;
        }
        .ctrl-btn.active-amber {
            background: rgba(240, 165, 36, 0.22);
            border-color: rgba(255, 200, 96, 0.65);
            color: #fff6e0;
            box-shadow: 0 0 20px rgba(255, 184, 62, 0.28);
        }
        .ctrl-btn.active-amber .led {
            background: #ffcb64;
            box-shadow: 0 0 10px #ffcb64;
        }
        @media (max-width: 420px) {
            #controls-dock {
                gap: 6px;
                padding: 6px 7px;
            }
            .ctrl-btn {
                padding: 9px 11px;
                gap: 5px;
                font-size: 10px;
                letter-spacing: 0.06em;
            }
            .ctrl-btn svg {
                width: 14px;
                height: 14px;
            }
        }

        /* Caja de error discreta solo en caso de fallo de WebGL */
        #error-banner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 12, 14, 0.92);
            border: 1px solid rgba(255, 80, 80, 0.45);
            color: #f8d7da;
            padding: 18px 22px;
            border-radius: 14px;
            max-width: 88vw;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            z-index: 99;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- 3 botones interactivos minimalistas: Puertas, Capó y Luces -->
    <div id="controls-dock" role="toolbar" aria-label="Controles del vehículo">
        <button id="btn-doors" class="ctrl-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 17V9.5L10.5 5H19v12H5z"></path>
                <path d="M5 11.5h14"></path>
                <path d="M13.5 14h2.5"></path>
            </svg>
            <span>Puerta</span>
            <span class="led"></span>
        </button>

        <button id="btn-hood" class="ctrl-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 16h18"></path>
                <path d="M4 16l2-3.5h12l2 3.5"></path>
                <path d="M6.5 12.5L16 6.5"></path>
                <path d="M12 12.5v-3.2"></path>
            </svg>
            <span>Capó</span>
            <span class="led"></span>
        </button>

        <button id="btn-lights" class="ctrl-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M13 7a5 5 0 0 1 0 10H9.5A2.5 2.5 0 0 1 7 14.5v-5A2.5 2.5 0 0 1 9.5 7H13z"></path>
                <path d="M3 9h2.2"></path>
                <path d="M2.5 12h2.7"></path>
                <path d="M3 15h2.2"></path>
            </svg>
            <span>Luces</span>
            <span class="led"></span>
        </button>
    </div>

    <div id="error-banner"></div>

    <script>
        'use strict';

        // =====================================================================
        // 1. UTILIDADES MATEMÁTICAS Y PERFIL PARAMÉTRICO CAD (1984 FLAT-12)
        //    Eje +Z = Frontal | Eje -Z = Trasera | Eje +Y = Arriba | Eje ±X = Ancho
        // =====================================================================
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function clamp(v, min, max) {
            return Math.max(min, Math.min(max, v));
        }

        function smoothstep(e0, e1, x) {
            const t = clamp((x - e0) / (e1 - e0), 0, 1);
            return t * t * (3 - 2 * t);
        }

        function moveTowards(current, target, maxDelta) {
            if (Math.abs(target - current) <= maxDelta) return target;
            return current + Math.sign(target - current) * maxDelta;
        }

        // Vectores direccionales de referencia (inicializados en init() tras cargar Three.js)
        let DIR_UP, DIR_DOWN, DIR_FRONT, DIR_REAR, DIR_RIGHT, DIR_LEFT;

        /**
         * Anchura media de la carrocería (en metros) a lo largo del eje Z.
         * Recreación fiel de la icónica silueta en cuña con caderas traseras ultra anchas (1.94 m).
         */
        function getHalfWidth(z) {
            if (z >= 1.55) {
                const t = smoothstep(1.55, 2.22, z);
                return lerp(0.848, 0.785, t);
            }
            if (z >= 0.70) {
                const t = smoothstep(0.70, 1.55, z);
                return lerp(0.842, 0.848, t);
            }
            if (z >= -0.56) {
                // Ensanchamiento progresivo desde la puerta hacia las tomas laterales de branquias
                const t = smoothstep(0.70, -0.56, z);
                return lerp(0.842, 0.942, Math.pow(t, 1.35));
            }
            if (z >= -1.55) {
                const t = smoothstep(-0.56, -1.55, z);
                return lerp(0.942, 0.968, t);
            }
            const t = smoothstep(-1.55, -2.22, z);
            return lerp(0.968, 0.924, t);
        }

        /**
         * Altura inferior de la talonera / bajo lateral a lo largo del eje Z.
         */
        function getRockerY(z) {
            if (z > 1.72) {
                return lerp(0.185, 0.226, smoothstep(1.72, 2.22, z));
            }
            if (z < -1.65) {
                return lerp(0.195, 0.255, smoothstep(-1.65, -2.22, z));
            }
            return lerp(0.195, 0.185, smoothstep(-1.65, 1.72, z));
        }

        /**
         * Altura de la línea de hombro / cintura lateral a lo largo del eje Z.
         */
        function getShoulderY(z) {
            if (z >= 0.74) {
                // Caída aerodinámica en cuña desde la base del parabrisas hasta el morro
                const t = clamp((z - 0.74) / (2.22 - 0.74), 0, 1);
                return lerp(0.752, 0.482, Math.pow(t, 1.12));
            }
            if (z >= -0.56) {
                const t = smoothstep(0.74, -0.56, z);
                return lerp(0.752, 0.842, t);
            }
            const t = smoothstep(-0.56, -2.22, z);
            return lerp(0.842, 0.798, t);
        }

        /**
         * Altura exacta de la superficie superior (capó, aletas delanteras y traseras) en (x, z).
         */
        function getDeckY(x, z) {
            const ax = Math.abs(x);
            const hw = Math.max(0.1, getHalfWidth(z));
            const u = clamp(ax / hw, 0, 1);
            const base = getShoulderY(z);

            if (z >= 0.70) {
                // Sutil abombamiento sobre los pasos de rueda delanteros y ligera caída central
                const archBump = Math.exp(-Math.pow((z - 1.33) / 0.42, 2)) * 0.022 * smoothstep(0.45, 0.92, u);
                const centerCrown = (1 - u * u) * 0.016 * (1 - smoothstep(1.85, 2.22, z) * 0.45);
                const edgeRoll = -Math.pow(smoothstep(0.84, 1.0, u), 2) * 0.014;
                return base + archBump + centerCrown + edgeRoll;
            }
            if (z >= -0.56) {
                const edgeRoll = -Math.pow(smoothstep(0.82, 1.0, u), 2) * 0.016;
                return base + edgeRoll;
            }
            // Caderas traseras musculosas sobre las ruedas traseras
            const rearArchBump = Math.exp(-Math.pow((z + 1.22) / 0.52, 2)) * 0.024 * smoothstep(0.55, 0.95, u);
            const edgeRoll = -Math.pow(smoothstep(0.86, 1.0, u), 2) * 0.018;
            return base + rearArchBump + edgeRoll;
        }

        /**
         * Curvatura en planta del borde delantero del morro (empalma capó, aletas y parachoques).
         */
        function getFrontZCurved(x, z) {
            if (z <= 1.72) return z;
            const hw = Math.max(0.1, getHalfWidth(z));
            const u = clamp(Math.abs(x) / hw, 0, 1);
            const frontFactor = smoothstep(1.72, 2.22, z);
            return z - Math.pow(u, 2.6) * 0.088 * frontFactor;
        }

        /**
         * Invierte el orden de los índices de triángulos de una BufferGeometry.
         */
        function flipGeometryWinding(geom) {
            const idx = geom.getIndex();
            if (idx) {
                const arr = idx.array;
                for (let i = 0; i < arr.length; i += 3) {
                    const tmp = arr[i + 1];
                    arr[i + 1] = arr[i + 2];
                    arr[i + 2] = tmp;
                }
                idx.needsUpdate = true;
            } else {
                const pos = geom.attributes.position;
                for (let i = 0; i < pos.count; i += 3) {
                    for (let k = 0; k < 3; k++) {
                        const a = pos.array[(i + 1) * 3 + k];
                        pos.array[(i + 1) * 3 + k] = pos.array[(i + 2) * 3 + k];
                        pos.array[(i + 2) * 3 + k] = a;
                    }
                }
                pos.needsUpdate = true;
            }
        }

        /**
         * Genera una superficie paramétrica continua (loft) a partir de una malla 2D de Vector3
         * con verificación matemática automática de la orientación de normales hacia el exterior.
         */
        function createLoftGeometry(grid, expectedDir) {
            const rows = grid.length;
            const cols = grid[0].length;
            const positions = [];
            const uvs = [];
            const indices = [];

            for (let r = 0; r < rows; r++) {
                const v = rows > 1 ? r / (rows - 1) : 0;
                for (let c = 0; c < cols; c++) {
                    const u = cols > 1 ? c / (cols - 1) : 0;
                    const p = grid[r][c];
                    positions.push(p.x, p.y, p.z);
                    uvs.push(u, v);
                }
            }

            for (let r = 0; r < rows - 1; r++) {
                for (let c = 0; c < cols - 1; c++) {
                    const a = r * cols + c;
                    const b = r * cols + (c + 1);
                    const d = (r + 1) * cols + c;
                    const e = (r + 1) * cols + (c + 1);
                    indices.push(a, d, b);
                    indices.push(b, d, e);
                }
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geom.setIndex(indices);
            geom.computeVertexNormals();

            if (expectedDir) {
                const norm = geom.attributes.normal;
                const avg = new THREE.Vector3();
                for (let i = 0; i < norm.count; i++) {
                    const nx = norm.getX(i), ny = norm.getY(i), nz = norm.getZ(i);
                    if (isFinite(nx) && isFinite(ny) && isFinite(nz)) {
                        avg.x += nx;
                        avg.y += ny;
                        avg.z += nz;
                    }
                }
                if (avg.dot(expectedDir) < 0) {
                    flipGeometryWinding(geom);
                    geom.computeVertexNormals();
                }
            }
            return geom;
        }

        /**
         * Clona una geometría reflejándola en el eje X y corrigiendo el orden de triángulos
         * para conservar escala positiva (1,1,1), normales reales y sombras perfectas.
         */
        function createMirroredGeometry(geom) {
            const m = geom.clone();
            const pos = m.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                pos.setX(i, -pos.getX(i));
            }
            pos.needsUpdate = true;
            flipGeometryWinding(m);
            m.computeVertexNormals();
            return m;
        }

        /**
         * Añade una malla al lado derecho (+X) y su reflejo geométrico perfecto al lado izquierdo (-X).
         */
        function addSymmetricMesh(parent, geom, mat, castShadow, receiveShadow) {
            const rightMesh = new THREE.Mesh(geom, mat);
            rightMesh.castShadow = !!castShadow;
            rightMesh.receiveShadow = !!receiveShadow;
            parent.add(rightMesh);

            const leftMesh = new THREE.Mesh(createMirroredGeometry(geom), mat);
            leftMesh.castShadow = !!castShadow;
            leftMesh.receiveShadow = !!receiveShadow;
            parent.add(leftMesh);

            return [rightMesh, leftMesh];
        }

        // =====================================================================
        // 2. GENERADORES DE TEXTURAS PROCEDURALES PBR (CERO ASSETS EXTERNOS)
        // =====================================================================
        function makeCanvas(w, h) {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            return c;
        }

        /**
         * Mapa normal de micro-partículas metálicas de pintura automotriz Rosso Corsa.
         */
        function createMetallicFlakeNormalMap() {
            const s = 256;
            const canvas = makeCanvas(s, s);
            const ctx = canvas.getContext('2d');
            const img = ctx.createImageData(s, s);
            const d = img.data;
            let seed = 1337;
            const rand = () => {
                seed = (seed * 16807) % 2147483647;
                return (seed - 1) / 2147483646;
            };
            for (let i = 0; i < s * s; i++) {
                const idx = i * 4;
                const spark = rand() > 0.72 ? 1.0 : 0.25;
                d[idx]     = 128 + (rand() - 0.5) * 44 * spark;
                d[idx + 1] = 128 + (rand() - 0.5) * 44 * spark;
                d[idx + 2] = 248;
                d[idx + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(22, 22);
            return tex;
        }

        /**
         * Textura sutil de piel de naranja del barniz transparente (clearcoat).
         */
        function createClearcoatNormalMap() {
            const s = 256;
            const canvas = makeCanvas(s, s);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgb(128,128,255)';
            ctx.fillRect(0, 0, s, s);
            for (let i = 0; i < 420; i++) {
                const x = (Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) % 1 * s;
                const y = (Math.sin(i * 78.233)  * 43758.5453 % 1 + 1) % 1 * s;
                const r = 6 + (i % 9);
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(134,132,255,0.22)');
                g.addColorStop(1, 'rgba(128,128,255,0.0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(14, 14);
            return tex;
        }

        /**
         * Dibujo direccional en V de neumático deportivo clásico de perfil ancho.
         */
        function createTireTreadTextures() {
            const w = 512, h = 512;
            const bumpC = makeCanvas(w, h);
            const bctx = bumpC.getContext('2d');
            bctx.fillStyle = '#cfcfcf';
            bctx.fillRect(0, 0, w, h);

            // 4 surcos circunferenciales profundos
            bctx.fillStyle = '#181818';
            [115, 200, 312, 397].forEach((gx) => {
                bctx.fillRect(gx - 11, 0, 22, h);
            });

            // Bloques diagonales en espiga (típico Pirelli P7 / Michelin TRX años 80)
            bctx.strokeStyle = '#1e1e1e';
            bctx.lineWidth = 10;
            for (let y = -h; y < h * 2; y += 42) {
                bctx.beginPath();
                bctx.moveTo(0, y + 36);
                bctx.lineTo(w * 0.5, y);
                bctx.lineTo(w, y + 36);
                bctx.stroke();

                bctx.lineWidth = 4;
                bctx.beginPath();
                bctx.moveTo(28, y + 20);
                bctx.lineTo(100, y + 8);
                bctx.moveTo(w - 28, y + 20);
                bctx.lineTo(w - 100, y + 8);
                bctx.stroke();
                bctx.lineWidth = 10;
            }

            const bumpTex = new THREE.CanvasTexture(bumpC);
            bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping;
            bumpTex.repeat.set(1, 7);
            return { bumpTex };
        }

        /**
         * Flanco de neumático con anillos concéntricos y tipografía moldeada 255/45 VR16.
         */
        function createTireSidewallTexture() {
            const s = 512;
            const c = makeCanvas(s, s);
            const ctx = c.getContext('2d');
            const cx = s / 2, cy = s / 2;

            ctx.fillStyle = '#141518';
            ctx.fillRect(0, 0, s, s);

            // Anillos satinados del flanco
            ctx.strokeStyle = '#24262b';
            ctx.lineWidth = 5;
            [168, 198, 224, 240].forEach((r) => {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
            });

            // Inscripciones radiales moldeadas en el caucho
            ctx.fillStyle = '#383b42';
            ctx.font = 'bold 20px Inter, Arial, sans-serif';
            ctx.textAlign = 'center';
            const labels = ['CORSA P700', '255/45 VR16', 'MODENA RADIAL', 'STEEL BELTED'];
            labels.forEach((txt, idx) => {
                const baseAngle = idx * (Math.PI / 2);
                for (let k = 0; k < txt.length; k++) {
                    const ang = baseAngle + (k - txt.length / 2) * 0.088;
                    ctx.save();
                    ctx.translate(cx + Math.cos(ang) * 208, cy + Math.sin(ang) * 208);
                    ctx.rotate(ang + Math.PI / 2);
                    ctx.fillText(txt[k], 0, 0);
                    ctx.restore();
                }
            });

            const tex = new THREE.CanvasTexture(c);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        /**
         * Disco de freno ventilado de acero cepillado circular y perforado radialmente.
         */
        function createBrakeDiscTexture() {
            const s = 512;
            const c = makeCanvas(s, s);
            const ctx = c.getContext('2d');
            const cx = s / 2, cy = s / 2;

            const grad = ctx.createRadialGradient(cx, cy, 85, cx, cy, 248);
            grad.addColorStop(0.0, '#3a3d42');
            grad.addColorStop(0.36, '#50545b');
            grad.addColorStop(0.39, '#b6bcc6');
            grad.addColorStop(0.70, '#c8ced8');
            grad.addColorStop(0.95, '#9ea4ae');
            grad.addColorStop(1.0, '#62666e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, s, s);

            // Micro-surcos circulares de fricción de las pastillas
            for (let r = 104; r < 240; r += 2.2) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.strokeStyle = (Math.floor(r) % 2 === 0) ? 'rgba(255,255,255,0.12)' : 'rgba(20,22,26,0.16)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Perforaciones deportivas en espiral
            ctx.fillStyle = '#15171b';
            for (let i = 0; i < 20; i++) {
                const base = (i / 20) * Math.PI * 2;
                [135, 168, 202].forEach((r, k) => {
                    const ang = base + k * 0.095;
                    ctx.beginPath();
                    ctx.arc(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, 5.2, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            const tex = new THREE.CanvasTexture(c);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        /**
         * Cuero italiano granulado (Cuoio / Nero) con textura natural.
         */
        function createLeatherBumpMap() {
            const s = 256;
            const c = makeCanvas(s, s);
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, s, s);
            for (let i = 0; i < 2800; i++) {
                const x = (Math.sin(i * 19.13) * 43758.5453 % 1 + 1) % 1 * s;
                const y = (Math.sin(i * 47.91) * 43758.5453 % 1 + 1) % 1 * s;
                const rad = 1.4 + (i % 3) * 0.9;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(220,220,220,0.30)' : 'rgba(42,42,42,0.32)';
                ctx.beginPath();

        /**
         * Texturas procedurales auténticas de lente óptica europea Carello 1984:
         * ranuras verticales de difusión, sector de corte asimétrico diagonal y
         * anillo óptico central tipo Fresnel con relieve cristalino.
         */
        function createCarelloLensTextures() {
            const w = 512, h = 320;
            const bumpCanvas = makeCanvas(w, h);
            const bctx = bumpCanvas.getContext('2d');
            const mapCanvas = makeCanvas(w, h);
            const mctx = mapCanvas.getContext('2d');

            bctx.fillStyle = '#808080';
            bctx.fillRect(0, 0, w, h);

            mctx.fillStyle = '#dce6f0';
            mctx.fillRect(0, 0, w, h);

            const fluteW = 10;
            for (let x = 0; x < w; x += fluteW) {
                const g = bctx.createLinearGradient(x, 0, x + fluteW, 0);
                g.addColorStop(0.0, '#2e2e2e');
                g.addColorStop(0.5, '#f0f0f0');
                g.addColorStop(1.0, '#2e2e2e');
                bctx.fillStyle = g;
                bctx.fillRect(x, 0, fluteW, h);

                mctx.fillStyle = 'rgba(255,255,255,0.16)';
                mctx.fillRect(x + 3, 0, 3, h);
                mctx.fillStyle = 'rgba(25,38,52,0.14)';
                mctx.fillRect(x, 0, 1.5, h);
            }

            // Sector de corte asimétrico diagonal (típico haz europeo H4)
            bctx.save();
            bctx.beginPath();
            bctx.moveTo(w * 0.50, h * 0.52);
            bctx.lineTo(w * 0.96, h * 0.14);
            bctx.lineTo(w * 0.96, h * 0.56);
            bctx.closePath();
            bctx.clip();
            for (let d = -h; d < w + h; d += 12) {
                bctx.strokeStyle = '#d8d8d8';
                bctx.lineWidth = 5;
                bctx.beginPath();
                bctx.moveTo(d, 0);
                bctx.lineTo(d - h * 0.45, h);
                bctx.stroke();
            }
            bctx.restore();

            [0.26, 0.52, 0.78].forEach((fy) => {
                bctx.fillStyle = '#363636';
                bctx.fillRect(0, h * fy - 2, w, 4);
                mctx.fillStyle = 'rgba(40,52,66,0.22)';
                mctx.fillRect(0, h * fy - 1, w, 2);
            });

            // Zona central tipo Fresnel sobre la bombilla H4
            const cx = w * 0.5, cy = h * 0.52;
            [26, 46, 68, 92].forEach((r) => {
                bctx.beginPath();
                bctx.arc(cx, cy, r, 0, Math.PI * 2);
                bctx.strokeStyle = '#efefef';
                bctx.lineWidth = 4;
                bctx.stroke();

                mctx.beginPath();
                mctx.arc(cx, cy, r, 0, Math.PI * 2);
                mctx.strokeStyle = 'rgba(255,255,255,0.34)';
                mctx.lineWidth = 2;
                mctx.stroke();
            });

            bctx.strokeStyle = '#202020';
            bctx.lineWidth = 18;
            bctx.strokeRect(9, 9, w - 18, h - 18);

            mctx.strokeStyle = 'rgba(18,24,32,0.45)';
            mctx.lineWidth = 14;
            mctx.strokeRect(7, 7, w - 14, h - 14);

            const map = new THREE.CanvasTexture(mapCanvas);
            map.encoding = THREE.sRGBEncoding;
            const bumpMap = new THREE.CanvasTexture(bumpCanvas);
            return { map, bumpMap };
        }

        /**
         * Proyección UV cúbica en metros reales para eliminar estiramientos en ExtrudeGeometry y TorusGeometry.
         */
        function applyBoxUV(geom, uvScale = 1.0) {
            const g = geom.index ? geom.toNonIndexed() : geom;
            if (!g.attributes.normal) {
                g.computeVertexNormals();
            }
            const pos = g.attributes.position;
            const norm = g.attributes.normal;
            const uvs = new Float32Array(pos.count * 2);
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = pos.getZ(i);
                const ax = Math.abs(norm.getX(i));
                const ay = Math.abs(norm.getY(i));
                const az = Math.abs(norm.getZ(i));
                let u, v;
                if (ax >= ay && ax >= az) {
                    u = z;
                    v = y;
                } else if (ay >= ax && ay >= az) {
                    u = x;
                    v = z;
                } else {
                    u = x;
                    v = y;
                }
                uvs[i * 2] = u * uvScale;
                uvs[i * 2 + 1] = v * uvScale;
            }
            g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
            return g;
        }

        /**
         * Cuero italiano anilina Nappa de grano celular ultrafino (sin poros gigantes ni costuras falsas).
         */
        function createAnilineLeatherTextures(baseHex, shadeRgb, highlightRgb, repeatVal) {
            const s = 512;
            const mapC = makeCanvas(s, s);
            const mctx = mapC.getContext('2d');
            const bumpC = makeCanvas(s, s);
            const bctx = bumpC.getContext('2d');

            mctx.fillStyle = baseHex;
            mctx.fillRect(0, 0, s, s);
            bctx.fillStyle = '#808080';
            bctx.fillRect(0, 0, s, s);

            let seed = 4217;
            const rand = () => {
                seed = (seed * 16807) % 2147483647;
                return (seed - 1) / 2147483646;
            };

            // Micro-grano orgánico fino (células suaves de 0.6-1.4 px)
            for (let i = 0; i < 24000; i++) {
                const x = rand() * s;
                const y = rand() * s;
                const rx = 0.55 + rand() * 0.85;
                const ry = 0.45 + rand() * 0.75;
                const ang = rand() * Math.PI;
                const isHi = rand() > 0.42;

                mctx.fillStyle = isHi ? highlightRgb : shadeRgb;
                mctx.beginPath();
                mctx.ellipse(x, y, rx, ry, ang, 0, Math.PI * 2);
                mctx.fill();

                bctx.fillStyle = isHi ? 'rgba(176,176,176,0.22)' : 'rgba(84,84,84,0.22)';
                bctx.beginPath();
                bctx.ellipse(x, y, rx * 0.9, ry * 0.9, ang, 0, Math.PI * 2);
                bctx.fill();
            }

            // Vetas sutiles de flexibilidad natural en la piel
            for (let v = 0; v < 42; v++) {
                const vx = rand() * s;
                const vy = rand() * s;
                const len = 18 + rand() * 44;
                const a = rand() * Math.PI;
                bctx.strokeStyle = 'rgba(92,92,92,0.14)';
                bctx.lineWidth = 0.8;
                bctx.beginPath();
                bctx.moveTo(vx, vy);
                bctx.quadraticCurveTo(
                    vx + Math.cos(a + 0.3) * len * 0.5,
                    vy + Math.sin(a + 0.3) * len * 0.5,
                    vx + Math.cos(a) * len,
                    vy + Math.sin(a) * len
                );
                bctx.stroke();
            }

            const rep = repeatVal || 3.4;
            const map = new THREE.CanvasTexture(mapC);
            map.encoding = THREE.sRGBEncoding;
            map.wrapS = map.wrapT = THREE.RepeatWrapping;
            map.repeat.set(rep, rep);

            const bumpMap = new THREE.CanvasTexture(bumpC);
            bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
            bumpMap.repeat.set(rep, rep);
            return { map, bumpMap };
        }

        function createSingleDialTexture(label, unit, ticksCount, redFromFrac, needleAng) {
            const s = 256;
            const c = makeCanvas(s, s);
            const ctx = c.getContext('2d');
            const cx = s / 2, cy = s / 2, r = 114;

            ctx.fillStyle = '#090a0d';
            ctx.fillRect(0, 0, s, s);

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#07080a';

            ctx.lineWidth = 5;
            ctx.strokeStyle = '#2c3038';

            for (let i = 0; i <= ticksCount; i++) {
                const frac = i / ticksCount;
                const ang = lerp(Math.PI * 0.76, Math.PI * 2.24, frac);
                const major = (i % 2 === 0);

                ctx.beginPath();

                ctx.lineWidth = major ? 4 : 2;
                ctx.stroke();

            ctx.fillStyle = '#ffd288';
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, cx, cy - 28);

            ctx.fillStyle = '#e89b44';
            ctx.font = 'bold 18px Inter, sans-serif';

            ctx.moveTo(cx - Math.cos(needleAng) * 18, cy - Math.sin(needleAng) * 18);
            ctx.lineTo(cx + Math.cos(needleAng) * (r - 16), cy + Math.sin(needleAng) * (r - 16));
            ctx.strokeStyle = '#ff4c1e';
            ctx.lineWidth = 5.5;

            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#1e2126';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#c8ced8';
            ctx.stroke();

            const tex = new THREE.CanvasTexture(c);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

            const grad = mctx.createLinearGradient(0, 0, s, s);
            grad.addColorStop(0, '#c8962c');
            grad.addColorStop(0.5, '#f0c858');
            grad.addColorStop(1, '#b68020');
            mctx.fillStyle = grad;
            mctx.fillRect(0, 0, s, s);

            bctx.fillStyle = '#808080';
            bctx.fillRect(0, 0, s, s);

            // Patrón romboidal gofrado
            const step = 24;
            for (let y = -step; y < s + step; y += step) {
                for (let x = -step; x < s + step; x += step) {
                    const g = bctx.createRadialGradient(x + step / 2, y + step / 2, 1, x + step / 2, y + step / 2, step * 0.6);
                    g.addColorStop(0, '#f2f2f2');
                    g.addColorStop(1, '#2c2c2c');
                    bctx.fillStyle = g;
                    bctx.fillRect(x, y, step, step);
                }
            }
            bctx.strokeStyle = '#181818';
            bctx.lineWidth = 2;
            for (let d = -s; d < s * 2; d += step) {
                bctx.beginPath(); bctx.moveTo(d, 0); bctx.lineTo(d + s, s); bctx.stroke();
                bctx.beginPath(); bctx.moveTo(d, 0); bctx.lineTo(d - s, s); bctx.stroke();
            }

            const map = new THREE.CanvasTexture(mapC);
            map.encoding = THREE.sRGBEncoding;
            map.wrapS = map.wrapT = THREE.RepeatWrapping;
            map.repeat.set(5, 2);

            const bumpMap = new THREE.CanvasTexture(bumpC);
            bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
            bumpMap.repeat.set(5, 2);
            return { map, bumpMap };
        }

        /**
         * Aluminio arenado de fundición para bloque, colectores y caja transaxle.
         */
        function createCastAluminumBump() {
            const s = 256;
            const c = makeCanvas(s, s);
            const ctx = c.getContext('2d');
            const img = ctx.createImageData(s, s);
            const d = img.data;
            let seed = 9182;
            const rand = () => {
                seed = (seed * 16807) % 2147483647;
                return (seed - 1) / 2147483646;
            };
            for (let i = 0; i < s * s; i++) {
                const v = Math.floor(96 + rand() * 72);
                d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
                d[i * 4 + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 6);
            return tex;
        }

        /**
         * Revestimiento acústico acolchado en rombos (diamond-quilted) para el interior del capó delantero.
         */
        function createQuiltedHoodPadTexture() {
            const s = 512;
            const mapC = makeCanvas(s, s);
            const mctx = mapC.getContext('2d');
            const bumpC = makeCanvas(s, s);
            const bctx = bumpC.getContext('2d');

            mctx.fillStyle = '#181a1f';
            mctx.fillRect(0, 0, s, s);
            bctx.fillStyle = '#969696';
            bctx.fillRect(0, 0, s, s);

            const step = 64;
            mctx.strokeStyle = 'rgba(8, 9, 12, 0.72)';
            mctx.lineWidth = 4;
            bctx.strokeStyle = '#383838';
            bctx.lineWidth = 5;

            for (let k = -s; k <= s * 2; k += step) {
                mctx.beginPath(); mctx.moveTo(k, 0); mctx.lineTo(k + s, s); mctx.stroke();
                mctx.beginPath(); mctx.moveTo(k, s); mctx.lineTo(k + s, 0); mctx.stroke();
                bctx.beginPath(); bctx.moveTo(k, 0); bctx.lineTo(k + s, s); bctx.stroke();
                bctx.beginPath(); bctx.moveTo(k, s); bctx.lineTo(k + s, 0); bctx.stroke();
            }

            // Pespuntes finos en los cruces de rombo
            mctx.strokeStyle = 'rgba(92, 98, 110, 0.35)';
            mctx.lineWidth = 1.2;
            mctx.setLineDash([4, 5]);
            for (let k = -s; k <= s * 2; k += step) {
                mctx.beginPath(); mctx.moveTo(k, 0); mctx.lineTo(k + s, s); mctx.stroke();
                mctx.beginPath(); mctx.moveTo(k, s); mctx.lineTo(k + s, 0); mctx.stroke();
            }
            mctx.setLineDash([]);

            const map = new THREE.CanvasTexture(mapC);
            map.encoding = THREE.sRGBEncoding;
            map.wrapS = map.wrapT = THREE.RepeatWrapping;
            map.repeat.set(2.2, 2.8);

            const bumpMap = new THREE.CanvasTexture(bumpC);
            bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
            bumpMap.repeat.set(2.2, 2.8);
            return { map, bumpMap };
        }

        // 3. ENTORNO HDRI DE ESTUDIO FOTOGRÁFICO (ESTRICTO OPACO -> ZERO RGBE8 BLOWOUT)
        // =====================================================================
        function createSoftboxTexture(coreColor, edgeFade) {
            const w = 256, h = 256;
            const c = makeCanvas(w, h);
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);

            const gx = ctx.createRadialGradient(w / 2, h / 2, 16, w / 2, h / 2, w * 0.48);
            gx.addColorStop(0.0, coreColor);
            gx.addColorStop(edgeFade, coreColor);
            gx.addColorStop(1.0, '#000000');
            ctx.fillStyle = gx;
            ctx.fillRect(0, 0, w, h);
            const tex = new THREE.CanvasTexture(c);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function createStripLightTexture(coreColor, edgeFade) {
            const w = 256, h = 256;
            const c = makeCanvas(w, h);
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);

            const gx = ctx.createLinearGradient(0, 0, w, 0);
            gx.addColorStop(0.0, '#000000');
            gx.addColorStop(0.18, coreColor);
            gx.addColorStop(0.82, coreColor);
            gx.addColorStop(1.0, '#000000');
            ctx.fillStyle = gx;
            ctx.fillRect(0, 0, w, h);

            const gy = ctx.createLinearGradient(0, 0, 0, h);
            gy.addColorStop(0.0, 'rgba(0,0,0,1)');
            gy.addColorStop(edgeFade, 'rgba(0,0,0,0)');
            gy.addColorStop(1 - edgeFade, 'rgba(0,0,0,0)');
            gy.addColorStop(1.0, 'rgba(0,0,0,1)');
            ctx.fillStyle = gy;
            ctx.fillRect(0, 0, w, h);

            const tex = new THREE.CanvasTexture(c);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function createStudioEnvironment(renderer) {
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();

            const envScene = new THREE.Scene();
            envScene.background = new THREE.Color(0x030306).convertSRGBToLinear();

            // Cúpula oscura de estudio fotográfico para alto contraste y reflejos líquidos
            const domeMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color(0x040508).convertSRGBToLinear(),
                side: THREE.BackSide
            });
            envScene.add(new THREE.Mesh(new THREE.SphereGeometry(28, 32, 16), domeMat));

            // Paneles softbox estrictamente OPACOS (evita corrupción RGBE8 en Three r128)
            function addSoftbox(w, h, pos, lookAt, coreHex, fade, strip) {
                const tex = strip
                    ? createStripLightTexture(coreHex, fade)
                    : createSoftboxTexture(coreHex, fade);
                const mat = new THREE.MeshBasicMaterial({
                    map: tex,
                    side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                mesh.position.set(pos[0], pos[1], pos[2]);
                mesh.lookAt(lookAt[0], lookAt[1], lookAt[2]);
                envScene.add(mesh);
            }

            // Doble bancada cenital estrecha (dibuja reflejos nítidos sin quemar el rojo a blanco)
            addSoftbox(1.05, 17.5, [ 1.9, 11.2, 0], [ 1.2, 0, 0], '#e8eeff', 0.22, true);
            addSoftbox(1.05, 17.5, [-1.9, 11.2, 0], [-1.2, 0, 0], '#dde6fa', 0.22, true);
            // Tiras laterales de horizonte estrechas (resaltan las caderas, branquias y pasos de rueda)
            addSoftbox(18.0, 1.05, [ 10.8, 2.8, 0.2], [0, 0.55, 0], '#dce4f8', 0.20, true);
            addSoftbox(18.0, 1.05, [-10.8, 2.8, 0.2], [0, 0.55, 0], '#dce4f8', 0.20, true);
            // Tira baja sutil para brillo inferior de branquias y llantas
            addSoftbox(15.0, 0.65, [ 10.2, 0.95, 0.0], [0, 0.35, 0], '#f0b8ac', 0.22, true);
            addSoftbox(15.0, 0.65, [-10.2, 0.95, 0.0], [0, 0.35, 0], '#f0b8ac', 0.22, true);
            // Softbox frontal y trasero controlados para mantener el rojo fatuo profundo
            addSoftbox(5.6, 1.8, [0, 5.4,  13.2], [0, 0.5, 0], '#b8afa4', 0.38, false);
            addSoftbox(7.2, 2.4, [0, 5.6, -13.0], [0, 0.6, 0], '#bccce8', 0.38, false);

            const envRT = pmrem.fromScene(envScene, 0.028);
            pmrem.dispose();
            return envRT.texture;
        }

        // =====================================================================
        // 5. CONSTRUCTOR DE PASOS DE RUEDA HUECOS CON LABIO INTERIOR REAL
        // =====================================================================
        function buildWheelArchFenderGeometry(cfg) {
            const { zc, yc, archR, zFront, zRear, flareOut, angleSteps } = cfg;
            const grid = [];

            for (let i = 0; i <= angleSteps; i++) {
                const t = i / angleSteps; // 0 = esquina trasera baja, 1 = esquina delantera baja
                // Borde exterior continuo: sube por zRear, recorre la cresta superior y baja por zFront
                let zOut, yOut;
                if (t < 0.25) {
                    const lt = t / 0.25;
                    zOut = zRear;
                    yOut = lerp(getRockerY(zRear), getDeckY(getHalfWidth(zRear), zRear), lt);
                } else if (t <= 0.75) {
                    const lt = (t - 0.25) / 0.50;
                    zOut = lerp(zRear, zFront, lt);
                    yOut = getDeckY(getHalfWidth(zOut), zOut);
                } else {
                    const lt = (t - 0.75) / 0.25;
                    zOut = zFront;
                    yOut = lerp(getDeckY(getHalfWidth(zFront), zFront), getRockerY(zFront), lt);
                }

                // Borde interior siguiendo el arco circular del paso de rueda
                const ang = lerp(Math.PI + 0.26, -0.26, t);
                const zIn = zc + Math.cos(ang) * archR;
                const yIn = Math.max(getRockerY(zIn), yc + Math.sin(ang) * archR);

                const hwOut = getHalfWidth(zOut);
                const hwIn = getHalfWidth(zIn);
                const lowerTuckOut = (1 - smoothstep(getRockerY(zOut), getShoulderY(zOut) * 0.62, yOut)) * 0.044;
                const xOut = hwOut - lowerTuckOut;
                const archFlare = Math.pow(Math.max(0, Math.sin(ang)), 0.75) * flareOut;
                const xLip = hwIn + archFlare - (1 - smoothstep(getRockerY(zIn), getShoulderY(zIn) * 0.62, yIn)) * 0.032;

                // 5 estaciones radiales: desde el borde exterior hasta el labio doblado hacia adentro
                const row = [
                    new THREE.Vector3(xOut, yOut, zOut),
                    new THREE.Vector3(lerp(xOut, xLip, 0.45) + archFlare * 0.35, lerp(yOut, yIn, 0.42), lerp(zOut, zIn, 0.42)),
                    new THREE.Vector3(lerp(xOut, xLip, 0.85) + archFlare * 0.20, lerp(yOut, yIn, 0.82), lerp(zOut, zIn, 0.82)),
                    new THREE.Vector3(xLip, yIn, zIn),
                    new THREE.Vector3(xLip - 0.034, yIn - 0.004, zIn)
                ];
                grid.push(row);
            }

            return createLoftGeometry(grid, DIR_RIGHT);
        }

        // =====================================================================
        // 6. UTILIDAD DE AMORTIGUADORES HIDRÁULICOS TELESCÓPICOS REALES
        // =====================================================================
        function createHydraulicStrut(parent, mats, cylLen, rodLen) {
            const cyl = new THREE.Mesh(
                new THREE.CylinderGeometry(0.0085, 0.0085, cylLen, 10),
                mats.matteBlackTrim
            );
            const rod = new THREE.Mesh(
                new THREE.CylinderGeometry(0.0042, 0.0042, rodLen, 10),
                mats.chrome
            );
            const ballA = new THREE.Mesh(new THREE.SphereGeometry(0.010, 8, 8), mats.matteBlackTrim);
            const ballB = new THREE.Mesh(new THREE.SphereGeometry(0.009, 8, 8), mats.matteBlackTrim);
            parent.add(cyl, rod, ballA, ballB);
            return { cyl, rod, ballA, ballB, cylLen, rodLen };
        }

        let _strutUp, _strutDir, _strutQuat, _strutPosLid;

        function updateHydraulicStrut(strut, pivot, anchorCar, anchorLidLocal) {
            _strutPosLid.copy(anchorLidLocal).applyEuler(pivot.rotation).add(pivot.position);
            _strutDir.copy(_strutPosLid).sub(anchorCar);
            const dist = _strutDir.length();
            if (dist < 0.001) return;
            _strutDir.divideScalar(dist);
            _strutQuat.setFromUnitVectors(_strutUp, _strutDir);

            strut.ballA.position.copy(anchorCar);
            strut.ballB.position.copy(_strutPosLid);

            strut.cyl.quaternion.copy(_strutQuat);
            strut.cyl.position.copy(anchorCar).addScaledVector(_strutDir, strut.cylLen * 0.5);

            strut.rod.quaternion.copy(_strutQuat);
            strut.rod.position.copy(_strutPosLid).addScaledVector(_strutDir, -strut.rodLen * 0.5);
        }

        // =====================================================================
        // 7. CARROCERÍA PRINCIPAL HERMÉTICA, PUERTAS, FAROS CARELLO Y CAPÓS
        // =====================================================================
        function buildMainBody(carGroup, mats) {
            const bodyGroup = new THREE.Group();
            carGroup.add(bodyGroup);

            const animRefs = {
                doorPivots: [],
                headlightPivots: [],
                headlightBeams: [],
                headlightHalos: [],
                headlightSpots: [],
                hoodPivot: null,
                engineLidPivot: null,
                frontStruts: [],
                rearStruts: [],
                cabinLight: null,
                engineBayLight: null,
                plateLight: null
            };

            // Suelo estructural / panza plana aerodinámica oscura (sella el coche por debajo)
            const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.045, 4.18), mats.panelSeam);
            floorMesh.position.set(0, 0.178, -0.02);
            bodyGroup.add(floorMesh);

            // -----------------------------------------------------------------
            // A. CAPÓ DELANTERO ARTICULADO (MALETERO CON EQUIPAJE A MEDIDA)
            // -----------------------------------------------------------------
            const hoodHingeZ = 0.74;
            const hoodHingeY = getDeckY(0, hoodHingeZ) - 0.006;
            const hoodPivot = new THREE.Group();
            hoodPivot.position.set(0, hoodHingeY, hoodHingeZ);
            bodyGroup.add(hoodPivot);
            animRefs.hoodPivot = hoodPivot;

            // Superficie superior continua del capó delantero (sellado al ras del morro)
            const hoodGrid = [];
            for (let r = 0; r <= 18; r++) {
                const tz = r / 18;
                const zBase = lerp(0.742, 2.218, tz);
                const row = [];
                for (let c = 0; c <= 14; c++) {
                    const u = (c / 14) * 2 - 1;
                    const x = u * 0.4365;
                    const z = getFrontZCurved(x, zBase);
                    const y = getDeckY(x, z);
                    row.push(new THREE.Vector3(x, y - hoodHingeY, z - hoodHingeZ));
                }
                hoodGrid.push(row);
            }
            const hoodMesh = new THREE.Mesh(createLoftGeometry(hoodGrid, DIR_UP), mats.paint);
            hoodMesh.castShadow = true;
            hoodMesh.receiveShadow = true;
            hoodPivot.add(hoodMesh);

            // Contraplaca estructural pintada del capó + marco en X + acolchado en rombos + placa
            const hoodInnerGrid = [];
            for (let r = 0; r <= 12; r++) {
                const tz = r / 12;
                const zBase = lerp(0.76, 2.17, tz);
                const row = [];
                for (let c = 0; c <= 10; c++) {
                    const u = (c / 10) * 2 - 1;
                    const x = u * 0.415;
                    const z = getFrontZCurved(x, zBase);
                    const y = getDeckY(x, z) - 0.010;
                    row.push(new THREE.Vector3(x, y - hoodHingeY, z - hoodHingeZ));
                }
                hoodInnerGrid.push(row);
            }
            const hoodInner = new THREE.Mesh(createLoftGeometry(hoodInnerGrid, DIR_DOWN), mats.matteBlackTrim);
            hoodPivot.add(hoodInner);

            // Panel central acústico acolchado en rombos bajo el capó
            const hoodPadGrid = [];
            for (let r = 0; r <= 10; r++) {
                const tz = r / 10;
                const zBase = lerp(0.92, 1.98, tz);
                const row = [];
                for (let c = 0; c <= 8; c++) {
                    const u = (c / 8) * 2 - 1;
                    const x = u * 0.305;
                    const z = getFrontZCurved(x, zBase);
                    const y = getDeckY(x, z) - 0.016;
                    row.push(new THREE.Vector3(x, y - hoodHingeY, z - hoodHingeZ));
                }
                hoodPadGrid.push(row);
            }
            hoodPivot.add(new THREE.Mesh(createLoftGeometry(hoodPadGrid, DIR_DOWN), mats.quiltedPad));

            // Refuerzos nervados perimetrales y en X estampados bajo el capó
            [
                [new THREE.Vector3(-0.34, getDeckY(-0.34, 0.84) - 0.017 - hoodHingeY, 0.84 - hoodHingeZ),
                 new THREE.Vector3( 0.34, getDeckY( 0.34, 2.04) - 0.017 - hoodHingeY, 2.04 - hoodHingeZ)],
                [new THREE.Vector3( 0.34, getDeckY( 0.34, 0.84) - 0.017 - hoodHingeY, 0.84 - hoodHingeZ),
                 new THREE.Vector3(-0.34, getDeckY(-0.34, 2.04) - 0.017 - hoodHingeY, 2.04 - hoodHingeZ)],
                [new THREE.Vector3(-0.36, getDeckY(-0.36, 0.84) - 0.016 - hoodHingeY, 0.84 - hoodHingeZ),
                 new THREE.Vector3(-0.36, getDeckY(-0.36, 2.04) - 0.016 - hoodHingeY, 2.04 - hoodHingeZ)],
                [new THREE.Vector3( 0.36, getDeckY( 0.36, 0.84) - 0.016 - hoodHingeY, 0.84 - hoodHingeZ),
                 new THREE.Vector3( 0.36, getDeckY( 0.36, 2.04) - 0.016 - hoodHingeY, 2.04 - hoodHingeZ)]
            ].forEach(([p0, p1]) => {
                const rib = new THREE.Mesh(
                    new THREE.TubeGeometry(new THREE.CatmullRomCurve3([p0, p1]), 8, 0.008, 6, false),
                    mats.matteBlackTrim
                );
                hoodPivot.add(rib);
            });

            // Bisagras forjadas traseras + argolla cromada de cierre + placa metálica de chasis bajo capó
            [-0.34, 0.34].forEach((hx) => {
                const hingeArm = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.024, 0.09), mats.brushedSteel);
                hingeArm.position.set(hx, -0.018, 0.045);
                hoodPivot.add(hingeArm);
            });

                liftRod.position.set(-side * 0.04, -0.085, 0.04);
                liftRod.rotation.x = 0.55;
                wellGroup.add(liftRod);

                // Pivote articulado trasero del faro escamoteable (eje X en z = 1.565)
                const hlHingeY = yHingeDeck - 0.004;
                const hlPivot = new THREE.Group();
                hlPivot.position.set(wellCenterX, hlHingeY, 1.565);
                bodyGroup.add(hlPivot);
                animRefs.headlightPivots.push(hlPivot);

                // 1. Tapa superior pintada en Rosso Corsa a ras exacto del capó/aleta (siguiendo curvatura frontal)
                const lidGrid = [];
                for (let r = 0; r <= 8; r++) {
                    const zBase = lerp(1.567, 1.934, r / 8);
                    const row = [];
                    for (let c = 0; c <= 8; c++) {
                        const xAbs = lerp(0.438, 0.770, c / 8);
                        const xW = side * xAbs;
                        const z = getFrontZCurved(xW, zBase);
                        row.push(new THREE.Vector3(xW - wellCenterX, getDeckY(xW, z) - hlHingeY, z - 1.565));
                    }
                    lidGrid.push(row);
                }
                const lidMesh = new THREE.Mesh(createLoftGeometry(lidGrid, DIR_UP), mats.paint);
                lidMesh.castShadow = true;
                lidMesh.receiveShadow = true;
                hlPivot.add(lidMesh);

                // Canto frontal pintado con espesor real de chapa
                const lidFrontLipGrid = [];
                for (let r = 0; r <= 2; r++) {
                    const dy = -r * 0.0055;
                    const dz = r === 1 ? 0.003 : 0.0;
                    const row = [];
                    for (let c = 0; c <= 8; c++) {
                        const xAbs = lerp(0.440, 0.770, c / 8);
                        const xW = side * xAbs;
                        row.push(new THREE.Vector3(xW - wellCenterX, getDeckY(xW, 1.934) - hlHingeY + dy, 1.934 - 1.565 + dz));
                    }
                    lidFrontLipGrid.push(row);
                }
                hlPivot.add(new THREE.Mesh(createLoftGeometry(lidFrontLipGrid, DIR_FRONT), mats.paint));

                // 2. Carcasa lateral en cuña aerodinámica (estrictamente DEBAJO de la tapa)
                const wedgeShape = new THREE.Shape();
                wedgeShape.moveTo(0.010, -0.006);
                wedgeShape.lineTo(0.362, -0.088);
                wedgeShape.lineTo(0.338, -0.098);
                wedgeShape.lineTo(0.286, -0.184);
                wedgeShape.lineTo(0.032, -0.128);
                wedgeShape.closePath();

                const shroudGeom = new THREE.ExtrudeGeometry(wedgeShape, {
                    depth: 0.312,
                    bevelEnabled: true,
                    bevelThickness: 0.005,
                    bevelSize: 0.004,
                    bevelSegments: 2
                });
                shroudGeom.rotateY(-Math.PI / 2);
                shroudGeom.translate(0.156, 0, 0);
                const shroudMesh = new THREE.Mesh(shroudGeom, mats.matteBlackTrim);
                shroudMesh.castShadow = true;
                shroudMesh.receiveShadow = true;
                hlPivot.add(shroudMesh);

                // Mejillas laterales pintadas biseladas en los flancos superiores del faro
                const cheekShroudShape = new THREE.Shape();
                cheekShroudShape.moveTo(0.02, -0.005);
                cheekShroudShape.lineTo(0.365, -0.086);
                cheekShroudShape.lineTo(0.348, -0.114);
                cheekShroudShape.lineTo(0.02, -0.030);
                cheekShroudShape.closePath();
                const cheekSideGeom = new THREE.ExtrudeGeometry(cheekShroudShape, { depth: 0.008, bevelEnabled: false });
                cheekSideGeom.rotateY(-Math.PI / 2);
                [-0.161, 0.161].forEach((cx) => {
                    const cs = new THREE.Mesh(cheekSideGeom, mats.paint);
                    cs.position.x = cx + 0.004;
                    hlPivot.add(cs);
                });

                // 3. Subconjunto óptico Carello (inclinado +0.52 rad para mirar horizontal al abrirse)
                const opticsGroup = new THREE.Group();
                opticsGroup.position.set(0, -0.138, 0.316);
                opticsGroup.rotation.x = 0.52;
                hlPivot.add(opticsGroup);

                const outerBezel = new THREE.Mesh(new THREE.BoxGeometry(0.324, 0.106, 0.022), mats.matteBlackTrim);
                outerBezel.castShadow = true;
                opticsGroup.add(outerBezel);

                const centerDivider = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.098, 0.028), mats.matteBlackTrim);
                centerDivider.position.set(0, 0, 0.004);
                opticsGroup.add(centerDivider);

                // 4 tornillos inoxidables en las esquinas del bisel
                [[-0.152, 0.044], [0.152, 0.044], [-0.152, -0.044], [0.152, -0.044]].forEach(([bx, by]) => {
                    const bScrew = new THREE.Mesh(new THREE.CylinderGeometry(0.0032, 0.0032, 0.006, 8), mats.chrome);
                    bScrew.rotation.x = Math.PI / 2;
                    bScrew.position.set(bx, by, 0.012);
                    opticsGroup.add(bScrew);
                });

                // Cuenco parabólico cóncavo real
                const dishPts = [];
                for (let k = 0; k <= 10; k++) {
                    const t = k / 10;
                    dishPts.push(new THREE.Vector2(lerp(0.006, 0.056, t), (t * t) * 0.036));
                }
                const parabolaGeom = new THREE.LatheGeometry(dishPts, 24);
                parabolaGeom.rotateX(Math.PI / 2);

                // Cristal abombado Carello
                const lensGeom = new THREE.PlaneGeometry(0.132, 0.080, 8, 6);
                const lPos = lensGeom.attributes.position;
                for (let i = 0; i < lPos.count; i++) {
                    const lx = lPos.getX(i) / 0.066;
                    const ly = lPos.getY(i) / 0.040;
                    lPos.setZ(i, (1 - 0.45 * lx * lx - 0.45 * ly * ly) * 0.009);
                }
                lensGeom.computeVertexNormals();

                [-0.078, 0.078].forEach((ox) => {
                    const unit = new THREE.Group();
                    unit.position.set(ox, 0, 0.004);
                    opticsGroup.add(unit);

                    const cavityBack = new THREE.Mesh(new THREE.BoxGeometry(0.138, 0.086, 0.032), mats.panelSeam);
                    cavityBack.position.z = -0.012;
                    unit.add(cavityBack);

                    const parabolicDish = new THREE.Mesh(parabolaGeom, mats.popUpReflectorLit);
                    parabolicDish.scale.set(1.22, 0.78, 1.0);
                    parabolicDish.position.z = -0.020;
                    unit.add(parabolicDish);

                    const rimTop = new THREE.Mesh(new THREE.BoxGeometry(0.138, 0.005, 0.012), mats.chrome);
                    rimTop.position.set(0, 0.041, 0.012);
                    const rimBot = rimTop.clone();
                    rimBot.position.y = -0.041;
                    const rimL = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.086, 0.012), mats.chrome);
                    rimL.position.set(-0.067, 0, 0.012);
                    const rimR = rimL.clone();
                    rimR.position.x = 0.067;
                    unit.add(rimTop, rimBot, rimL, rimR);

                    const bulbBase = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.009, 0.016, 12), mats.brushedSteel);
                    bulbBase.rotation.x = Math.PI / 2;
                    bulbBase.position.z = -0.012;
                    unit.add(bulbBase);

                    const bulbGlass = new THREE.Mesh(new THREE.SphereGeometry(0.012, 14, 14), mats.popUpBulbCore);
                    bulbGlass.scale.set(0.95, 0.95, 1.35);
                    bulbGlass.position.z = -0.002;
                    unit.add(bulbGlass);

                    const glareCap = new THREE.Mesh(new THREE.CylinderGeometry(0.0085, 0.010, 0.007, 12), mats.matteBlackTrim);
                    glareCap.rotation.x = Math.PI / 2;
                    glareCap.position.z = 0.007;
                    unit.add(glareCap);

                    const glassLens = new THREE.Mesh(lensGeom, mats.popUpLensGlass);
                    glassLens.position.z = 0.014;
                    glassLens.renderOrder = 3;
                    unit.add(glassLens);
                });

                // Haz volumétrico suave de luz halógena
                const beamGeom = new THREE.ConeGeometry(0.68, 3.4, 24, 1, true);
                beamGeom.translate(0, -1.7, 0);
                beamGeom.rotateX(-Math.PI / 2);
                const beamMesh = new THREE.Mesh(beamGeom, mats.headlightBeam);
                beamMesh.position.set(0, 0, 0.028);
                beamMesh.renderOrder = 6;
                opticsGroup.add(beamMesh);
                animRefs.headlightBeams.push(beamMesh);

                const haloSprite = new THREE.Sprite(mats.haloWarmSprite);
                haloSprite.position.set(0, 0, 0.042);
                haloSprite.scale.set(0.50, 0.30, 1);
                haloSprite.renderOrder = 7;
                opticsGroup.add(haloSprite);
                animRefs.headlightHalos.push(haloSprite);

                const spot = new THREE.SpotLight(0xffe4b2, 0.0, 12.0, Math.PI / 5.2, 0.62, 1.6);
                spot.position.set(0, 0, 0.04);
                const spotTarget = new THREE.Object3D();
                spotTarget.position.set(0, -0.16, 4.5);
                opticsGroup.add(spotTarget);
                spot.target = spotTarget;
                opticsGroup.add(spot);
                animRefs.headlightSpots.push(spot);
            });

            // -----------------------------------------------------------------
            // D. MORRO FRONTAL ENVOLVENTE Y ESQUINAS DELANTERAS SELLADAS
            // -----------------------------------------------------------------
            const noseGrid = [];
            const noseProfile = [
                [0.00,  0.000],
                [0.22,  0.024],
                [0.54,  0.030],
                [0.82,  0.012],
                [1.00, -0.024]
            ];
            const noseMaxX = getHalfWidth(2.218);
            for (let r = 0; r < noseProfile.length; r++) {
                const [t, zBulge] = noseProfile[r];
                const row = [];
                for (let c = 0; c <= 26; c++) {
                    const u = (c / 26) * 2 - 1;
                    const x = u * noseMaxX;
                    const zEdge = getFrontZCurved(x, 2.218);
                    const yTop = getDeckY(x, zEdge);
                    const yBot = 0.366;
                    const y = lerp(yTop, yBot, t);
                    const z = zEdge + zBulge * (1 - Math.abs(u) * 0.25);
                    row.push(new THREE.Vector3(x, y, z));
                }
                noseGrid.push(row);
            }
            const noseMesh = new THREE.Mesh(createLoftGeometry(noseGrid, DIR_FRONT), mats.paint);
            noseMesh.castShadow = true;
            noseMesh.receiveShadow = true;
            bodyGroup.add(noseMesh);

            // Esquina lateral delantera CONTINUA (z = 1.72 .. 2.22) sellada sin muescas
            const frontQuarterSideGrid = [];
            for (let r = 0; r <= 12; r++) {
                const tz = r / 12;
                const zParam = lerp(1.72, 2.218, tz);
                const hw = getHalfWidth(zParam);
                const zTop = getFrontZCurved(hw, zParam);
                const yTop = getDeckY(hw, zTop);
                const yMid = lerp(yTop, 0.366, 0.55);
                const yLow = 0.366;
                const yBot = lerp(getRockerY(1.72), 0.226, smoothstep(0.0, 0.78, tz));

                const tuckLow = (1 - smoothstep(getRockerY(zParam), getShoulderY(zParam) * 0.62, yLow)) * 0.044 * (1 - tz * 0.65);
                const tuckBot = 0.044 * (1 - tz * 0.22);
                const noseCornerZ = tz * 0.018;
                const zLow = tz > 0.85 ? lerp(zTop + noseCornerZ * 0.35, zTop - 0.018, (tz - 0.85) / 0.15) : (zTop + noseCornerZ * 0.35);

                frontQuarterSideGrid.push([
                    new THREE.Vector3(hw, yTop, zTop),
                    new THREE.Vector3(hw + 0.005 * (1 - tz), yMid, zTop + noseCornerZ * 0.65),
                    new THREE.Vector3(hw - tuckLow, yLow, zLow),
                    new THREE.Vector3(hw - tuckBot * 0.85, lerp(yLow, yBot, 0.52), zTop - 0.018),
                    new THREE.Vector3(hw - tuckBot, yBot, zTop - 0.022)
                ]);
            }
            addSymmetricMesh(bodyGroup, createLoftGeometry(frontQuarterSideGrid, DIR_RIGHT), mats.paint, true, true);

            // Cierre redondeado vertical de la esquina del parachoques sellado hasta el spoiler
            const cornerWrapGrid = [];
            for (let r = 0; r <= 6; r++) {
                const ty = r / 6;
                const y = lerp(0.370, 0.226, ty);
                const xOut = lerp(0.782, 0.752, ty);
                const zOut = lerp(2.114, 2.104, ty);
                const xIn  = lerp(0.715, 0.705, ty);
                const zIn  = lerp(2.082, 2.076, ty);
                cornerWrapGrid.push([
                    new THREE.Vector3(xOut, y, zOut),
                    new THREE.Vector3(lerp(xOut, xIn, 0.5), y, zOut + 0.008),
                    new THREE.Vector3(xIn, y, zIn)
                ]);
            }
            addSymmetricMesh(bodyGroup, createLoftGeometry(cornerWrapGrid, DIR_FRONT), mats.paint, true, true);

            // Montante completo del pilar A y paso de rueda en z = 0.70 (sella la junta delantera de puerta)
            const fenderAStopGrid = [];
            for (let r = 0; r <= 6; r++) {
                const t = r / 6;
                const y = lerp(0.742, getRockerY(0.70), t);
                fenderAStopGrid.push([
                    new THREE.Vector3(0.710, y, 0.699),
                    new THREE.Vector3(getHalfWidth(0.70) - 0.004, y, 0.699)
                ]);
            }
            addSymmetricMesh(bodyGroup, createLoftGeometry(fenderAStopGrid, DIR_REAR), mats.panelSeam, false, true);

            // Rejilla negra de aireación bajo los limpiaparabrisas (cowl panel)
            const cowlMesh = new THREE.Mesh(new THREE.BoxGeometry(1.36, 0.024, 0.14), mats.matteBlackTrim);
            cowlMesh.position.set(0, 0.748, 0.72);
            cowlMesh.rotation.x = 0.08;
            bodyGroup.add(cowlMesh);

            // -----------------------------------------------------------------
            // E. PUERTAS ARTICULADAS, TOMA DE RADIADOR Y 5 LÁMINAS AERODINÁMICAS
            // -----------------------------------------------------------------
            function createStrakeBladeGeometry(spinePts, sideSign, bladeH, bladeInDepth) {
                // Perfil afilado de lama aerodinámica (cara superior plana, bisel frontal/inferior)
                const profile = [
                    [ 0.000,  0.50], // borde exterior superior
                    [-0.140,  0.50], // plano superior hacia el interior
                    [-0.280,  0.34], // chaflán interior superior
                    [-0.280, -0.34], // chaflán interior inferior
                    [-0.100, -0.50], // base inferior
                    [ 0.000, -0.22], // labio exterior afilado
                    [ 0.000,  0.50]  // cierre de anillo
                ];
                const grid = [];
                for (let i = 0; i < spinePts.length; i++) {
                    const p = spinePts[i];
                    const t = i / (spinePts.length - 1);
                    // Entrada afilada al ras en el borde delantero y salida estrecha atrás
                    const taper = smoothstep(0.0, 0.22, t);
                    const h = bladeH * lerp(0.28, 1.0, taper);
                    const depth = bladeInDepth * lerp(0.32, 1.0, taper);
                    const row = [];
                    for (let k = 0; k < profile.length; k++) {
                        const [px, py] = profile[k];
                        row.push(new THREE.Vector3(
                            p.x + sideSign * px * (depth / 0.28),
                            p.y + py * h,
                            p.z
                        ));
                    }
                    grid.push(row);
                }
                const geom = createLoftGeometry(grid, null);
                if (sideSign < 0) {
                    flipGeometryWinding(geom);
                    geom.computeVertexNormals();
                }
                return geom;
            }

            [1, -1].forEach((side) => {
                const outDir = side > 0 ? DIR_RIGHT : DIR_LEFT;
                const pivotX = side * 0.815;
                const pivotY = 0.48;
                const pivotZ = 0.695;

                // Umbral inferior del habitáculo + placa grabada MODENA V12 + bisagras
                const sillBox = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.105, 1.24), mats.paint);
                sillBox.position.set(side * 0.765, 0.232, 0.07);
                bodyGroup.add(sillBox);

                const sillPlate = new THREE.Mesh(new THREE.PlaneGeometry(0.84, 0.064), mats.sillPlate);
                sillPlate.rotation.x = -Math.PI / 2;
                sillPlate.rotation.z = side * Math.PI / 2;
                sillPlate.position.set(side * 0.755, 0.287, 0.07);
                bodyGroup.add(sillPlate);

                // Bisagras metálicas del pilar A
                [0.36, 0.62].forEach((hy) => {
                    const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.036, 10), mats.brushedSteel);
                    hinge.position.set(pivotX - side * 0.025, hy, pivotZ);
                    bodyGroup.add(hinge);
                });

                // Conducto lateral empotrado de admisión hacia los radiadores tras la puerta (cero caja saliente)
                const ductBack = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.56, 0.34), mats.panelSeam);
                ductBack.position.set(side * 0.815, 0.52, -0.68);
                bodyGroup.add(ductBack);

                // Panales de aluminio oscuro del radiador lateral visibles tras las láminas
                for (let rf = 0; rf < 9; rf++) {
                    const radFin = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.46, 0.008), mats.satinAnthracite);
                    radFin.position.set(side * 0.832, 0.50, -0.58 - rf * 0.024);
                    bodyGroup.add(radFin);
                }

                // Tapa lateral interior del paso de rueda delantero de la aleta trasera (cierra z = -0.56)
                const rearQuarterShutGrid = [];
                for (let r = 0; r <= 8; r++) {
                    const ty = r / 8;
                    const y = lerp(getRockerY(-0.56), getDeckY(getHalfWidth(-0.56), -0.56), ty);
                    const hw = getHalfWidth(-0.56);
                    const lowerTuck = (1 - smoothstep(getRockerY(-0.56), getShoulderY(-0.56) * 0.62, y)) * 0.044;
                    rearQuarterShutGrid.push([
                        new THREE.Vector3(side * (hw - lowerTuck), y, -0.56),
                        new THREE.Vector3(side * 0.810, y, -0.56)
                    ]);
                }
                bodyGroup.add(new THREE.Mesh(createLoftGeometry(rearQuarterShutGrid, DIR_FRONT), mats.panelSeam));

                // Pivote principal de la puerta
                const doorPivot = new THREE.Group();
                doorPivot.position.set(pivotX, pivotY, pivotZ);
                bodyGroup.add(doorPivot);
                animRefs.doorPivots.push({ pivot: doorPivot, side });

                // 1. Chapa exterior esculpida de la puerta (con canal aerodinámico profundo para las 5 branquias)
                const doorOuterGrid = [];
                for (let r = 0; r <= 14; r++) {
                    const tz = r / 14;
                    const z = lerp(-0.555, 0.695, tz);
                    const hw = getHalfWidth(z);
                    const yTop = getDeckY(hw, z);
                    const yBot = getRockerY(z);
                    const scoopDepth = Math.pow(smoothstep(0.55, -0.55, z), 1.35) * 0.105;

                    const row = [];
                    for (let c = 0; c <= 12; c++) {
                        const ty = c / 12;
                        const y = lerp(yBot, yTop, ty);
                        const lowerTuck = (1 - smoothstep(yBot, yBot + 0.22, y)) * 0.044;
                        const scoopBand = smoothstep(0.16, 0.30, ty) * (1 - smoothstep(0.76, 0.90, ty));
                        const x = side * (hw - lowerTuck - scoopDepth * scoopBand);
                        row.push(new THREE.Vector3(x - pivotX, y - pivotY, z - pivotZ));
                    }
                    doorOuterGrid.push(row);
                }
                const doorOuter = new THREE.Mesh(createLoftGeometry(doorOuterGrid, outDir), mats.paint);
                doorOuter.castShadow = true;
                doorOuter.receiveShadow = true;
                doorPivot.add(doorOuter);

                // Borde superior e interior trasero de la puerta (espesor real de chapa sellado)
                const doorTopGrid = [];
                for (let r = 0; r <= 12; r++) {
                    const z = lerp(-0.555, 0.695, r / 12);
                    const hw = getHalfWidth(z);
                    const y = getDeckY(hw, z);
                    doorTopGrid.push([
                        new THREE.Vector3(side * (hw - 0.098) - pivotX, y - pivotY, z - pivotZ),
                        new THREE.Vector3(side * hw - pivotX, y - pivotY, z - pivotZ)
                    ]);
                }
                doorPivot.add(new THREE.Mesh(createLoftGeometry(doorTopGrid, DIR_UP), mats.paint));

                const doorRearEdgeGrid = [];
                for (let r = 0; r <= 8; r++) {
                    const ty = r / 8;
                    const hw = getHalfWidth(-0.555);
                    const yBot = getRockerY(-0.555);
                    const y = lerp(yBot, getDeckY(hw, -0.555), ty);
                    const lowerTuck = (1 - smoothstep(yBot, yBot + 0.22, y)) * 0.044;
                    const scoopBand = smoothstep(0.16, 0.30, ty) * (1 - smoothstep(0.76, 0.90, ty));
                    const xOut = side * (hw - lowerTuck - 0.105 * scoopBand);
                    doorRearEdgeGrid.push([
                        new THREE.Vector3(xOut - pivotX, y - pivotY, -0.555 - pivotZ),
                        new THREE.Vector3(side * 0.748 - pivotX, y - pivotY, -0.555 - pivotZ)
                    ]);
                }
                doorPivot.add(new THREE.Mesh(createLoftGeometry(doorRearEdgeGrid, DIR_REAR), mats.paint));

                // Canto delantero de puerta sellado al ras del pilar A
                const doorFrontEdgeGrid = [];
                for (let r = 0; r <= 8; r++) {
                    const ty = r / 8;
                    const hw = getHalfWidth(0.695);
                    const yBot = getRockerY(0.695);
                    const y = lerp(yBot, getDeckY(hw, 0.695), ty);
                    const lowerTuck = (1 - smoothstep(yBot, yBot + 0.22, y)) * 0.044;
                    const xOut = side * (hw - lowerTuck);
                    doorFrontEdgeGrid.push([
                        new THREE.Vector3(xOut - pivotX, y - pivotY, 0.695 - pivotZ),
                        new THREE.Vector3(side * 0.725 - pivotX, y - pivotY, 0.695 - pivotZ)
                    ]);
                }
                doorPivot.add(new THREE.Mesh(createLoftGeometry(doorFrontEdgeGrid, DIR_FRONT), mats.paint));

                // 2. Las 5 icónicas branquias laterales esculpidas como láminas afiladas integradas en el flanco
                for (let sIdx = 0; sIdx < 5; sIdx++) {
                    const fracY = lerp(0.28, 0.74, sIdx / 4);
                    const zStart = lerp(0.32, 0.44, sIdx / 4);
                    const doorPts = [];
                    for (let k = 0; k <= 14; k++) {
                        const t = k / 14;
                        const z = lerp(zStart, -0.552, t);
                        const hw = getHalfWidth(z);
                        const y = lerp(getRockerY(z), getDeckY(hw, z), fracY);
                        const protrude = lerp(-0.026, 0.008, smoothstep(0.0, 0.40, t));
                        doorPts.push(new THREE.Vector3(side * (hw + protrude) - pivotX, y - pivotY, z - pivotZ));
                    }
                    const bladeGeom = createStrakeBladeGeometry(doorPts, side, 0.0155, 0.115);
                    const bladeMesh = new THREE.Mesh(bladeGeom, mats.paint);
                    bladeMesh.castShadow = true;
                    bladeMesh.receiveShadow = true;
                    doorPivot.add(bladeMesh);

                    // Continuación integrada en la boca lateral trasera hasta sumergirse en la aleta trasera
                    const extPts = [];
                    for (let k = 0; k <= 8; k++) {
                        const t = k / 8;
                        const z = lerp(-0.556, -0.74, t);
                        const hw = getHalfWidth(z);
                        const y = lerp(getRockerY(z), getDeckY(hw, z), fracY);
                        const inset = lerp(0.006, -0.032, smoothstep(0.0, 1.0, t));
                        extPts.push(new THREE.Vector3(side * (hw + inset), y, z));
                    }
                    const extBladeGeom = createStrakeBladeGeometry(extPts, side, 0.015, 0.105);
                    const extBladeMesh = new THREE.Mesh(extBladeGeom, mats.paint);
                    extBladeMesh.castShadow = true;
                    extBladeMesh.receiveShadow = true;
                    bodyGroup.add(extBladeMesh);
                }

                // 3. Maneta exterior empotrada estilo 1984 (cazoleta negra + tirador biselado)
