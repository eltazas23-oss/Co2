            const bPillarCloseGrid = [];
            for (let r = 0; r <= 6; r++) {
                const ty = r / 6;
                const y = lerp(0.835, 1.095, ty);
                const xOut = lerp(0.865, 0.618, ty);
                const xIn  = lerp(0.580, 0.565, ty);
                bPillarCloseGrid.push([
                    new THREE.Vector3(xOut, y, -0.475),
                    new THREE.Vector3(xIn,  y, -0.495)
                ]);
            }
            addSymmetricMesh(bodyGroup, createLoftGeometry(bPillarCloseGrid, DIR_FRONT), mats.paint, true, true);

            // Pilares traseros volantes (flying buttresses) icónicos desde el techo hasta la cola
            const buttressOuterGrid = [];
            const buttressTopGrid   = [];
            const buttressInnerGrid = [];
            for (let r = 0; r <= 12; r++) {
                const t = r / 12;
                const z = lerp(-0.48, -2.06, t);
                const xTopIn  = lerp(0.565, 0.595, t);
                const xTopOut = lerp(0.618, 0.725, t);
                const yTop    = lerp(1.095, getDeckY(xTopOut, z) + 0.006, Math.pow(t, 0.92));
                const yDeck   = getDeckY(xTopOut, z);
                const xBotOut = lerp(0.865, getHalfWidth(z) - 0.018, t);

                buttressTopGrid.push([
                    new THREE.Vector3(xTopIn,  yTop, z),
                    new THREE.Vector3(xTopOut, yTop, z)
                ]);
                buttressOuterGrid.push([
                    new THREE.Vector3(xTopOut, yTop, z),
                    new THREE.Vector3(xBotOut, yDeck, z)
                ]);
                buttressInnerGrid.push([
                    new THREE.Vector3(xTopIn, yTop, z),
                    new THREE.Vector3(xTopIn, yDeck - 0.02, z)
                ]);
            }
            addSymmetricMesh(bodyGroup, createLoftGeometry(buttressTopGrid,   DIR_UP),    mats.paint, true, true);
            addSymmetricMesh(bodyGroup, createLoftGeometry(buttressOuterGrid, DIR_RIGHT), mats.paint, true, true);
            addSymmetricMesh(bodyGroup, createLoftGeometry(buttressInnerGrid, DIR_LEFT),  mats.paint, true, true);

            // -----------------------------------------------------------------
            // H. CUBIERTA PANORÁMICA ARTICULADA DEL MOTOR FLAT-12 (VITRINA + LAMAS)
            // -----------------------------------------------------------------
            const lidHingeZ = -0.56;
            const lidHingeY = 0.892;
            const engineLidPivot = new THREE.Group();
            engineLidPivot.position.set(0, lidHingeY, lidHingeZ);
            bodyGroup.add(engineLidPivot);
            animRefs.engineLidPivot = engineLidPivot;

            // Marco estructural perimetral Rosso Corsa de la tapa motor
            const lidFrameFront = new THREE.Mesh(new THREE.BoxGeometry(1.14, 0.024, 0.07), mats.paint);
            lidFrameFront.position.set(0, -0.005, -0.035);
            lidFrameFront.castShadow = true;
            engineLidPivot.add(lidFrameFront);

            const lidFrameRear = new THREE.Mesh(new THREE.BoxGeometry(1.14, 0.024, 0.07), mats.paint);
            lidFrameRear.position.set(0, -0.088, -1.425);
            lidFrameRear.castShadow = true;
            engineLidPivot.add(lidFrameRear);

            [-0.545, 0.545].forEach((fx) => {
                const sideRail = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.024, 1.44), mats.paint);
                sideRail.position.set(fx, -0.046, -0.73);
                sideRail.rotation.x = -0.059;
                sideRail.castShadow = true;
                engineLidPivot.add(sideRail);
            });

            // Vitrina central panorámica de cristal templado ligeramente curvado
            const glassLidGrid = [];
            for (let r = 0; r <= 10; r++) {
                const tz = r / 10;
                const z = lerp(-0.07, -1.39, tz);
                const yEdge = lerp(-0.002, -0.084, tz);
                const row = [];
                for (let c = 0; c <= 12; c++) {
                    const u = (c / 12) * 2 - 1;
                    const x = u * 0.44;
                    const arch = (1 - u * u) * 0.018;
                    row.push(new THREE.Vector3(x, yEdge + arch, z));
                }
                glassLidGrid.push(row);
            }
            const engineGlassMesh = new THREE.Mesh(createLoftGeometry(glassLidGrid, DIR_UP), mats.engineGlass);
            engineGlassMesh.renderOrder = 4;
            engineLidPivot.add(engineGlassMesh);

            // Tornillería Allen inoxidable perimetral sujetando la vitrina de cristal
            for (let k = 0; k < 6; k++) {
                const tz = k / 5;
                const z = lerp(-0.14, -1.32, tz);
                const y = lerp(0.002, -0.078, tz);
                [-0.415, 0.415].forEach((bx) => {
                    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.0055, 0.0055, 0.008, 6), mats.chrome);
                    bolt.position.set(bx, y, z);
                    engineLidPivot.add(bolt);
                });
            }

            // Lamas clásicas de extracción térmica flanqueando la vitrina a izquierda y derecha
            [-0.482, 0.482].forEach((lx) => {
                for (let i = 0; i < 9; i++) {
                    const tz = i / 8;
                    const z = lerp(-0.14, -1.32, tz);
                    const y = lerp(-0.006, -0.082, tz);
                    const louver = new THREE.Mesh(new THREE.BoxGeometry(0.082, 0.008, 0.064), mats.matteBlackTrim);
                    louver.position.set(lx, y, z);
                    louver.rotation.x = -0.28;
                    engineLidPivot.add(louver);
                }
            });

            // Amortiguadores hidráulicos telescópicos reales de la tapa trasera del motor
            [1, -1].forEach((side) => {
                const strut = createHydraulicStrut(bodyGroup, mats, 0.34, 0.33);
                animRefs.rearStruts.push({
                    strut,
                    anchorCar: new THREE.Vector3(side * 0.535, 0.635, -1.24),
                    anchorLidLocal: new THREE.Vector3(side * 0.525, -0.044, -0.52)
                });
            });

            // Luz de cortesía cálida del habitáculo (se enciende al abrir puertas)
            const cabinLight = new THREE.PointLight(0xffcf88, 0.0, 2.2, 1.8);
            cabinLight.position.set(0, 1.02, -0.08);
            bodyGroup.add(cabinLight);
            animRefs.cabinLight = cabinLight;

            // Luz de exposición dedicada para destacar el motor Flat-12
            const engineBayLight = new THREE.PointLight(0xfff1dc, 1.15, 3.0, 1.6);
            engineBayLight.position.set(0, 1.08, -1.24);
            bodyGroup.add(engineBayLight);
            animRefs.engineBayLight = engineBayLight;

            // Luz cálida de cortesía para el maletero delantero (se enciende al abrir el capó)
            const trunkLight = new THREE.PointLight(0xffe6bd, 0.0, 2.4, 1.6);
            trunkLight.position.set(0, 0.92, 1.44);
            bodyGroup.add(trunkLight);
            animRefs.trunkLight = trunkLight;

            return animRefs;
        }

        // =====================================================================
        // 8. MOTOR FLAT-12 4.9L 48V DE EXPOSICIÓN AAA (CONSTRUIDO PIEZA A PIEZA)
        // =====================================================================
        function buildDetailedFlat12Engine(carGroup, mats) {
            const engGroup = new THREE.Group();
            carGroup.add(engGroup);

            // A. CORTAFUEGOS EN LÁMINA TÉRMICA DE ORO GOFRADO + VANO OSCURO
            const firewall = new THREE.Mesh(new THREE.BoxGeometry(1.18, 0.58, 0.03), mats.goldFoil);
            firewall.position.set(0, 0.56, -0.58);
            engGroup.add(firewall);

            const bayFloor = new THREE.Mesh(new THREE.BoxGeometry(1.16, 0.03, 1.44), mats.panelSeam);
            bayFloor.position.set(0, 0.25, -1.30);
            engGroup.add(bayFloor);

            // B. SUBCHASIS MULTITUBULAR TRIANGULADO Y TORRETAS DE SUSPENSIÓN CNC
            [1, -1].forEach((side) => {
                const railPts = [
                    new THREE.Vector3(side * 0.52, 0.72, -0.60),
                    new THREE.Vector3(side * 0.52, 0.66, -1.96)
                ];
                engGroup.add(new THREE.Mesh(
                    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(railPts), 4, 0.015, 8, false),
                    mats.matteBlackTrim
                ));

                // Riostra diagonal triangulada
                const diagPts = [
                    new THREE.Vector3(side * 0.52, 0.72, -0.62),
                    new THREE.Vector3(side * 0.44, 0.46, -1.20),
                    new THREE.Vector3(side * 0.52, 0.66, -1.88)
                ];
                engGroup.add(new THREE.Mesh(
                    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(diagPts), 10, 0.011, 8, false),
                    mats.matteBlackTrim
                ));

                // Torreta de suspensión CNC con muelle helicoidal rojo visible
                const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.056, 0.068, 0.14, 16), mats.machinedAluminum);
                tower.position.set(side * 0.465, 0.62, -1.22);
                engGroup.add(tower);

                const topCap = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.022, 12), mats.anodizedGold);
                topCap.position.set(side * 0.465, 0.70, -1.22);
                engGroup.add(topCap);

                // Espiras del muelle rojo de suspensión coilover
                for (let k = 0; k < 5; k++) {
                    const coil = new THREE.Mesh(new THREE.TorusGeometry(0.042, 0.008, 8, 18), mats.anodizedRed);
                    coil.rotation.x = Math.PI / 2 + 0.12;
                    coil.position.set(side * 0.465, 0.38 + k * 0.036, -1.22);
                    engGroup.add(coil);
                }
            });

            // Barra estabilizadora transversal superior del vano motor en aluminio pulido
            const strutBrace = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.94, 12), mats.machinedAluminum);
            strutBrace.rotation.z = Math.PI / 2;
            strutBrace.position.set(0, 0.705, -0.66);
            engGroup.add(strutBrace);

            // C. BLOQUE MOTOR FLAT-12 (180°) Y CAJA DE CAMBIOS TRANSAXLE ALETEADA
            const crankBlock = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.24, 0.88), mats.castAluminum);
            crankBlock.position.set(0, 0.42, -1.16);
            engGroup.add(crankBlock);

            const gearbox = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.145, 0.42, 18), mats.castAluminum);
            gearbox.rotation.x = Math.PI / 2;
            gearbox.position.set(0, 0.44, -1.78);
            engGroup.add(gearbox);

            // Aletas de refrigeración en la carcasa de la transmisión
            for (let f = 0; f < 8; f++) {
                const fin = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.012, 0.014), mats.machinedAluminum);
                fin.position.set(0, 0.545, -1.62 - f * 0.045);
                engGroup.add(fin);
            }

            // D. CAJAS DE ADMISIÓN GEMELAS ROSSO CRINKLE CON 7 ALETAS CNC Y PLACA MODENA
            [1, -1].forEach((side) => {
                const plenum = new THREE.Group();
                plenum.position.set(side * 0.255, 0.675, -1.18);
                engGroup.add(plenum);

                // Cuerpo fundido en pintura arrugada roja (Rosso Crinkle)
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.225, 0.115, 0.86), mats.engineCrinkleRed);
                body.castShadow = true;
                body.receiveShadow = true;
                plenum.add(body);

                // Biseles laterales redondeados del plenum
                const capFront = new THREE.Mesh(new THREE.CylinderGeometry(0.056, 0.056, 0.22, 14), mats.engineCrinkleRed);
                capFront.rotation.z = Math.PI / 2;
                capFront.position.set(0, 0, 0.43);
                const capRear = capFront.clone();
                capRear.position.z = -0.43;
                plenum.add(capFront, capRear);

                // 7 aletas longitudinales mecanizadas CNC en aluminio brillante
                for (let f = -3; f <= 3; f++) {
                    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.0085, 0.014, 0.82), mats.machinedAluminum);
                    rib.position.set(f * 0.028, 0.062, 0);
                    plenum.add(rib);
                }

                // Placa en relieve central "MODENA 4.9 V12 • 48 VALVOLE"
                const badge = new THREE.Mesh(new THREE.BoxGeometry(0.115, 0.008, 0.34), mats.engineBadge);
                badge.position.set(0, 0.068, 0);
                plenum.add(badge);

                // Tapa lateral de culata (valvecover) más baja hacia el exterior
                const valveCover = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, 0.84), mats.engineCrinkleRed);
                valveCover.position.set(side * 0.155, -0.155, 0);
                valveCover.rotation.z = side * -0.18;
                plenum.add(valveCover);

                // 6 COLECTORES DE ADMISIÓN INDIVIDUALES CURVOS + MANGUITOS + ABRAZADERAS + INYECTORES
                for (let c = 0; c < 6; c++) {
                    const zRun = lerp(0.34, -0.34, c / 5);
                    const runnerCurve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(side * 0.02, -0.02, zRun),
                        new THREE.Vector3(side * 0.135, -0.055, zRun),
                        new THREE.Vector3(side * 0.155, -0.14, zRun)
                    ]);
                    const runner = new THREE.Mesh(
                        new THREE.TubeGeometry(runnerCurve, 12, 0.022, 12, false),
                        mats.castAluminum
                    );
                    runner.castShadow = true;
                    plenum.add(runner);

                    // Manguito de silicona negra + doble abrazadera cromada
                    const coupler = new THREE.Mesh(new THREE.CylinderGeometry(0.0255, 0.0255, 0.036, 12), mats.rubber);
                    coupler.position.set(side * 0.145, -0.082, zRun);
                    coupler.rotation.z = side * 0.45;
                    plenum.add(coupler);

                    [-0.012, 0.012].forEach((dy) => {
                        const clampRing = new THREE.Mesh(new THREE.CylinderGeometry(0.027, 0.027, 0.006, 12), mats.chrome);
                        clampRing.position.set(side * 0.145 + side * dy * 0.4, -0.082 + dy, zRun);
                        clampRing.rotation.z = side * 0.45;
                        plenum.add(clampRing);
                    });

                    // Inyector metálico anodizado dorado en cada cilindro
                    const injector = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.009, 0.044, 10), mats.anodizedGold);
                    injector.position.set(side * 0.125, -0.025, zRun);
                    injector.rotation.z = side * -0.52;
                    plenum.add(injector);

                    // Colector de escape 6-en-1 con pátina térmica saliendo hacia abajo y atrás
                    const exhCurve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(side * 0.39, 0.44, -1.18 + zRun),
                        new THREE.Vector3(side * 0.44, 0.34, -1.28 + zRun * 0.8),
                        new THREE.Vector3(side * 0.32, 0.30, -1.84)
                    ]);
                    engGroup.add(new THREE.Mesh(
                        new THREE.TubeGeometry(exhCurve, 12, 0.015, 8, false),
                        mats.heatExhaust
                    ));
                }

                // Cuerpo de mariposa (throttle body) frontal en aluminio mecanizado
                const tb = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.046, 0.085, 14), mats.machinedAluminum);
                tb.rotation.x = Math.PI / 2;
                tb.position.set(0, -0.005, 0.49);
                plenum.add(tb);
            });

            // E. VALLE CENTRAL: INYECCIÓN BOSCH K-JETRONIC, 12 LATIGUILLOS AEROQUIP, VARILLAJE Y ENCENDIDO
            // Caja central de filtro de aire / distribuidor mecánico de combustible
            [-0.86, -1.48].forEach((fz) => {
                const kJet = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.064, 0.092, 16), mats.machinedAluminum);
                kJet.position.set(0, 0.655, fz);
                engGroup.add(kJet);

                const kTop = new THREE.Mesh(new THREE.CylinderGeometry(0.040, 0.040, 0.022, 12), mats.anodizedGold);
                kTop.position.set(0, 0.708, fz);
                engGroup.add(kTop);

                // 6 latiguillos trenzados Aeroquip saliendo de cada dosificador hacia los inyectores
                for (let side of [1, -1]) {
                    for (let j = 0; j < 3; j++) {
                        const targetZ = fz > -1.15 ? lerp(-0.84, -1.12, j / 2) : lerp(-1.26, -1.52, j / 2);
                        const hoseCurve = new THREE.CatmullRomCurve3([
                            new THREE.Vector3(side * 0.042, 0.70, fz),
                            new THREE.Vector3(side * 0.095, 0.738, lerp(fz, targetZ, 0.45)),
                            new THREE.Vector3(side * 0.145, 0.68, targetZ)
                        ]);
                        engGroup.add(new THREE.Mesh(
                            new THREE.TubeGeometry(hoseCurve, 12, 0.0046, 6, false),
                            mats.braidedSteel
                        ));

                        // Racores AN anodizados azul/rojo
                        const anFit = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.014, 6), j % 2 === 0 ? mats.anodizedBlue : mats.anodizedRed);
                        anFit.position.set(side * 0.046, 0.702, fz + (j - 1) * 0.018);
                        engGroup.add(anFit);
                    }
                }
            });

            // Varillaje central sincronizado de mariposas en latón/cadmio dorado
            const linkBar = new THREE.Mesh(new THREE.CylinderGeometry(0.0055, 0.0055, 0.74, 8), mats.anodizedGold);
            linkBar.rotation.x = Math.PI / 2;
            linkBar.position.set(0, 0.725, -1.16);
            engGroup.add(linkBar);

            [-0.78, -1.16, -1.54].forEach((lz) => {
                const crossRod = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, 0.30, 8), mats.anodizedGold);
                crossRod.rotation.z = Math.PI / 2;
                crossRod.position.set(0, 0.725, lz);
                engGroup.add(crossRod);
            });

            // Distribuidores gemelos + 12 cables de bujía rojos en peines separadores
            [1, -1].forEach((side) => {
                const distCap = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.038, 0.068, 14), mats.matteBlackTrim);
                distCap.position.set(side * 0.095, 0.61, -1.68);
                engGroup.add(distCap);

                for (let w = 0; w < 6; w++) {
                    const tz = lerp(-0.88, -1.48, w / 5);
                    const wireCurve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(side * 0.095, 0.64, -1.68),
                        new THREE.Vector3(side * 0.115, 0.625, lerp(-1.66, tz, 0.5)),
                        new THREE.Vector3(side * 0.21, 0.58, tz)
                    ]);
                    engGroup.add(new THREE.Mesh(
                        new THREE.TubeGeometry(wireCurve, 10, 0.0038, 6, false),
                        mats.sparkWireRed
                    ));
                }
            });

            // F. PERIFÉRICOS: VASO DE EXPANSIÓN PULIDO, DEPÓSITO CÁRTER SECO, FILTRO Y ALTERNADOR
            // Vaso de expansión de refrigerante en aluminio pulido (izquierda)
            const expTank = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.068, 0.19, 18), mats.machinedAluminum);
            expTank.rotation.z = Math.PI / 2;
            expTank.position.set(-0.37, 0.66, -1.80);
            engGroup.add(expTank);
            const expCap = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.024, 0.026, 12), mats.chrome);
            expCap.position.set(-0.37, 0.735, -1.80);
            engGroup.add(expCap);

            // Depósito de aceite de cárter seco con racores AN rojos/azules (derecha)
            const oilTank = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.072, 0.24, 18), mats.castAluminum);
            oilTank.position.set(0.39, 0.59, -1.78);
            engGroup.add(oilTank);
            const oilCap = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.022, 12), mats.anodizedRed);
            oilCap.position.set(0.39, 0.72, -1.78);
            engGroup.add(oilCap);

            // Latiguillo de retorno de aceite trenzado con racor azul
            const oilHose = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0.39, 0.68, -1.70),
                new THREE.Vector3(0.36, 0.64, -1.56),
                new THREE.Vector3(0.28, 0.54, -1.48)
            ]);
            engGroup.add(new THREE.Mesh(new THREE.TubeGeometry(oilHose, 10, 0.009, 8, false), mats.braidedSteel));

            // Alternador ventilado + polea + correa junto al cortafuegos
            const altBody = new THREE.Mesh(new THREE.CylinderGeometry(0.056, 0.056, 0.09, 16), mats.castAluminum);
            altBody.rotation.x = Math.PI / 2;
            altBody.position.set(0.18, 0.55, -0.68);
            engGroup.add(altBody);
            const altPulley = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.022, 14), mats.anodizedGold);
            altPulley.rotation.x = Math.PI / 2;
            altPulley.position.set(0.18, 0.55, -0.62);
            engGroup.add(altPulley);

            // Filtro de aceite vertical clásico
            const oilFilter = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.11, 16), mats.anodizedBlue);
            oilFilter.position.set(-0.18, 0.56, -0.70);
            engGroup.add(oilFilter);

            // Manguitos gruesos negros de refrigeración hacia los radiadores laterales
            [1, -1].forEach((side) => {
                const radPipe = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(side * 0.20, 0.54, -0.76),
                    new THREE.Vector3(side * 0.42, 0.50, -0.74),
                    new THREE.Vector3(side * 0.54, 0.42, -0.66)
                ]);
                engGroup.add(new THREE.Mesh(new THREE.TubeGeometry(radPipe, 10, 0.017, 10, false), mats.rubber));
            });
        }

        // =====================================================================
        // 9. FASCIA FRONTAL (PARRILLA, SPOILER, ANTINIEBLAS E INTERMITENTES)
        // =====================================================================
        function buildFrontFascia(carGroup, mats) {
            const frontGroup = new THREE.Group();
            carGroup.add(frontGroup);

            // Fondo negro de la boca de radiador (contenido dentro de las esquinas del parachoques)
            const mouthBack = new THREE.Mesh(new THREE.BoxGeometry(1.36, 0.145, 0.06), mats.panelSeam);
            mouthBack.position.set(0, 0.298, 2.055);
            frontGroup.add(mouthBack);

            // Rejilla clásica cuadriculada en antracita satinado
            for (let r = 0; r < 5; r++) {
                const bar = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.008, 0.036), mats.satinAnthracite);
                bar.position.set(0, 0.252 + r * 0.023, 2.138);
                frontGroup.add(bar);
            }
            for (let c = -6; c <= 6; c++) {
                const vbar = new THREE.Mesh(new THREE.BoxGeometry(0.007, 0.105, 0.026), mats.satinAnthracite);
                vbar.position.set(c * 0.068, 0.298, 2.132);
                frontGroup.add(vbar);
            }

            // Emblema cromado central de la parrilla delantera
            const grillCrest = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.044, 0.012), mats.chrome);
            grillCrest.position.set(0, 0.298, 2.155);
            frontGroup.add(grillCrest);

            // Spoiler / labio aerodinámico inferior envolvente negro satinado
            const lipGrid = [];
            for (let r = 0; r <= 4; r++) {
                const t = r / 4;
                const y = lerp(0.232, 0.188, t);
                const zOff = lerp(0.012, 0.038, Math.sin(t * Math.PI * 0.8));
                const row = [];
                for (let c = 0; c <= 20; c++) {
                    const u = (c / 20) * 2 - 1;
                    const x = u * 0.758;
                    const z = 2.148 - Math.pow(Math.abs(u), 2.4) * 0.088 + zOff * (1 - Math.abs(u) * 0.3);

            const rearGroup = new THREE.Group();

            // Pilotos traseros ocultos tras las 9 lamas negras (freno/posición, intermitente y marcha atrás)

                const tailRed = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.12, 0.024), mats.tailLightRed);
                tailRed.position.set(side * 0.64, 0.655, -2.208);

                const revLamp = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.075, 0.022), mats.reverseLight);
                revLamp.position.set(side * 0.42, 0.655, -2.206);
                rearGroup.add(revLamp);
            });

            // 9 lamas horizontales negras de ancho completo (sello inconfundible de 1984)
            for (let i = 0; i < 9; i++) {
                const slat = new THREE.Mesh(new THREE.BoxGeometry(1.84, 0.011, 0.042), mats.matteBlackTrim);

            // Emblema cromado central sobre las lamas traseras
            const rearCrest = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.056, 0.014), mats.chrome);
            rearCrest.position.set(0, 0.655, -2.250);
            rearGroup.add(rearCrest);

            // Parachoques trasero envolvente pintado en Rosso Corsa con biseles curvos
            const bumperGrid = [];
            const bProf = [
                [0.00, 0.00],
                [0.28, -0.030],
                [0.68, -0.028],
                [1.00, 0.005]
            ];
            for (let r = 0; r < bProf.length; r++) {
                const [t, zOff] = bProf[r];
                const y = lerp(0.530, 0.415, t);
                const row = [];
                for (let c = 0; c <= 18; c++) {
                    const u = (c / 18) * 2 - 1;
                    const x = u * 0.916;

                bumperGrid.push(row);

            [-0.42, -0.24, 0.24, 0.42].forEach((fx) => {

                fin.position.set(fx, 0.305, -2.155);
                rearGroup.add(fin);

            // Matrícula clásica "MO 84 V12" + iluminación puntual de matrícula
            const plate = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.095, 0.012), mats.licensePlate);
            plate.position.set(0, 0.348, -2.212);
            rearGroup.add(plate);

            const plateLight = new THREE.PointLight(0xfff0d4, 0.0, 0.9, 2.0);
            plateLight.position.set(0, 0.425, -2.24);
            rearGroup.add(plateLight);
            animRefs.plateLight = plateLight;

            // Cuádruple salida de escape cromada con interior oscuro de hollín
            const tipOuterGeom = new THREE.CylinderGeometry(0.036, 0.036, 0.19, 22, 1, true);
            tipOuterGeom.rotateX(Math.PI / 2);
            const tipInnerGeom = new THREE.CylinderGeometry(0.030, 0.030, 0.18, 18);
            tipInnerGeom.rotateX(Math.PI / 2);
            const tipRimGeom = new THREE.TorusGeometry(0.033, 0.004, 10, 22);

            [-0.66, -0.56, 0.56, 0.66].forEach((ex) => {
                const tipGroup = new THREE.Group();
                tipGroup.position.set(ex, 0.275, -2.21);
                rearGroup.add(tipGroup);

                const outer = new THREE.Mesh(tipOuterGeom, mats.chrome);

                inner.position.z = 0.008;
                const rim = new THREE.Mesh(tipRimGeom, mats.chrome);
                rim.position.z = -0.094;
                tipGroup.add(outer, inner, rim);

        function buildSideMirrors(doorPivots, mats) {
            const mShape = new THREE.Shape();

                depth: 0.068,

                bevelThickness: 0.018,

                const stalkCurve = new THREE.CatmullRomCurve3([

                    new THREE.Vector3(side * 0.120, 0.038, -0.028)

                stalk.scale.set(1, 0.72, 1.45);

                const housing = new THREE.Mesh(housingGeom, mats.paint);

                housing.scale.set(1, 0.92, 1.05);

                const bezel = new THREE.Mesh(new THREE.PlaneGeometry(0.140, 0.056), mats.matteBlackTrim);

            // Cojines verticales acolchados en el mamparo trasero

            bulkPadShape.lineTo( 0.085, -0.25);

            dashUpper.receiveShadow = true;
            intGroup.add(dashUpper);

            // Salpicadero inferior en cuero Cuoio biselado y sellado contra los kick panels

            dashLowShape.moveTo(-0.68, 0.505);
            dashLowShape.lineTo(-0.45, 0.515);
            dashLowShape.quadraticCurveTo(-0.36, 0.525, -0.37, 0.605);
            dashLowShape.lineTo(-0.39, 0.662);

                    intGroup.add(vBar);

            // -----------------------------------------------------------------
            // D. CÚPULA ARQUEADA HUECA DE INSTRUMENTOS + 6 RELOJES VEGLIA 3D
            // -----------------------------------------------------------------

            function addAnalogGauge(parent, x, y, z, r, mat, rotX) {
                const g = new THREE.Group();
                g.position.set(x, y, z);
                g.rotation.x = rotX || 0;
                parent.add(g);

                const face = new THREE.Mesh(new THREE.CircleGeometry(r, 24), mat);

                g.add(bezel);

                const glass = new THREE.Mesh(new THREE.CircleGeometry(r * 0.96, 20), mats.cabinGlass);

        // =====================================================================
        // 13. RUEDAS CLÁSICAS DE 5 RADIOS CÓNCAVOS, MONOTUERCA Y FRENOS PERFORADOS
        // =====================================================================
        function buildWheelAssembly(cfg, mats) {
            const { radius, width, isRight, isRear } = cfg;
            const wheelGroup = new THREE.Group();
            const rimR = radius * 0.635;
            const halfW = width * 0.5;
            const dir = isRight ? 1 : -1;

            // Banda de rodadura + hombros redondeados del neumático (LatheGeometry)
            const tirePts = [];
            const segs = 12;
            for (let i = 0; i <= segs; i++) {
                const t = i / segs; // -halfW .. +halfW
                const y = lerp(-halfW, halfW, t);
                const edge = Math.abs(t * 2 - 1);
                const r = radius - Math.pow(Math.max(0, edge - 0.72) / 0.28, 2) * (radius - rimR) * 0.16;
                tirePts.push(new THREE.Vector2(r, y));
            }
            const treadGeom = new THREE.LatheGeometry(tirePts, 44);
            treadGeom.rotateZ(Math.PI / 2);
            const treadMesh = new THREE.Mesh(treadGeom, mats.tireTread);
            treadMesh.castShadow = true;
            treadMesh.receiveShadow = true;
            wheelGroup.add(treadMesh);

            // Flancos del neumático con inscripción radial
            [1, -1].forEach((face) => {
                const swGeom = new THREE.RingGeometry(rimR * 0.98, radius * 0.975, 44, 1);
                // Reasignar UVs radiales para alinear el texto moldeado
                const pos = swGeom.attributes.position;
                const uv = swGeom.attributes.uv;
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i), y = pos.getY(i);
                    uv.setXY(i, x / (radius * 2) + 0.5, y / (radius * 2) + 0.5);
                }
                const sw = new THREE.Mesh(swGeom, mats.tireSidewall);
                sw.rotation.y = face > 0 ? Math.PI / 2 : -Math.PI / 2;
                sw.position.x = face * (halfW - 0.004);
                wheelGroup.add(sw);
            });

            // Barril interior de la llanta + labio exterior profundo pulido
            const barrel = new THREE.Mesh(
                new THREE.CylinderGeometry(rimR, rimR, width * 0.92, 36, 1, true),
                mats.alloyWheel
            );
            barrel.rotation.z = Math.PI / 2;
            const barrelMat = mats.alloyWheel.clone();
            barrelMat.side = THREE.DoubleSide;
            barrel.material = barrelMat;
            wheelGroup.add(barrel);

            const lipRing = new THREE.Mesh(new THREE.TorusGeometry(rimR - 0.005, 0.012, 12, 36), mats.chrome);
            lipRing.rotation.y = Math.PI / 2;
            lipRing.position.x = dir * (halfW - 0.012);
            wheelGroup.add(lipRing);

            // 5 radios en estrella cóncavos afilados icónicos de los años 80
            const dishDepth = isRear ? 0.068 : 0.044;
            const spokeShape = new THREE.Shape();
            spokeShape.moveTo(-0.028, 0.024);
            spokeShape.lineTo( 0.028, 0.024);
            spokeShape.lineTo( 0.018, rimR * 0.91);
            spokeShape.lineTo(-0.018, rimR * 0.91);
            spokeShape.closePath();
            const spokeGeom = new THREE.ExtrudeGeometry(spokeShape, {
                depth: 0.016,
                bevelEnabled: true,
                bevelThickness: 0.004,
                bevelSize: 0.003,
                bevelSegments: 2
            });
            spokeGeom.rotateY(Math.PI / 2);
            spokeGeom.translate(-0.008, 0, 0);

            for (let s = 0; s < 5; s++) {
                const ang = (s / 5) * Math.PI * 2;
                const spokePivot = new THREE.Group();
                spokePivot.rotation.x = ang;
                const spoke = new THREE.Mesh(spokeGeom, mats.alloyWheel);
                spoke.position.x = dir * (halfW - 0.028 - dishDepth * 0.56);
                spoke.rotation.z = dir * -0.16;
                spoke.castShadow = true;
                spokePivot.add(spoke);
                wheelGroup.add(spokePivot);
            }

            // Buje central + monotuerca hexagonal clásica (center-lock knock-off)
            const centerHub = new THREE.Mesh(new THREE.CylinderGeometry(0.056, 0.064, 0.048, 18), mats.alloyWheel);
            centerHub.rotation.z = Math.PI / 2;
            centerHub.position.x = dir * (halfW - 0.022 - dishDepth * 0.65);
            wheelGroup.add(centerHub);

            const hexNut = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.038, 0.036, 6), mats.chrome);
            hexNut.rotation.z = Math.PI / 2;
            hexNut.position.x = dir * (halfW - 0.008 - dishDepth * 0.50);
            wheelGroup.add(hexNut);

            const capEmblem = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.008, 16), mats.emblemYellow);
            capEmblem.rotation.z = Math.PI / 2;
            capEmblem.position.x = dir * (halfW + 0.010 - dishDepth * 0.50);
            wheelGroup.add(capEmblem);

            // Disco de freno perforado + pinza multipistón roja oculta dentro de la garganta
            const discR = rimR * 0.76;
            const disc = new THREE.Mesh(new THREE.CylinderGeometry(discR, discR, 0.020, 32), mats.brakeDisc);
            disc.rotation.z = Math.PI / 2;
            disc.position.x = dir * (halfW - 0.115 - dishDepth * 0.32);
            wheelGroup.add(disc);

            const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.042, 0.105, 0.064), mats.brakeCaliper);
            caliper.position.set(
                dir * (halfW - 0.112 - dishDepth * 0.32),
                0.035,
                isRear ? 0.112 : -0.112
            );
            wheelGroup.add(caliper);

            return wheelGroup;
        }

        function buildAllWheels(carGroup, mats) {
            const configs = [
                { x:  0.768, y: 0.315, z:  1.33, radius: 0.315, width: 0.235, isRight: true,  isRear: false },
                { x: -0.768, y: 0.315, z:  1.33, radius: 0.315, width: 0.235, isRight: false, isRear: false },
                { x:  0.808, y: 0.330, z: -1.22, radius: 0.330, width: 0.295, isRight: true,  isRear: true  },
                { x: -0.808, y: 0.330, z: -1.22, radius: 0.330, width: 0.295, isRight: false, isRear: true  }
            ];
            configs.forEach((c) => {
                const w = buildWheelAssembly(c, mats);
                w.position.set(c.x, c.y, c.z);
                carGroup.add(w);
            });
        }

        // =====================================================================
        // 14. INICIALIZACIÓN DE ESCENA, CÁMARA ORBITAL Y BUCLE DE ANIMACIÓN
        // =====================================================================
        function init() {
            // Inicializar vectores auxiliares una vez garantizada la carga de Three.js
            DIR_UP    = new THREE.Vector3(0, 1, 0);
            DIR_DOWN  = new THREE.Vector3(0, -1, 0);
            DIR_FRONT = new THREE.Vector3(0, 0, 1);
            DIR_REAR  = new THREE.Vector3(0, 0, -1);
            DIR_RIGHT = new THREE.Vector3(1, 0, 0);
            DIR_LEFT  = new THREE.Vector3(-1, 0, 0);

            _strutUp     = new THREE.Vector3(0, 1, 0);
            _strutDir    = new THREE.Vector3();
            _strutQuat   = new THREE.Quaternion();
            _strutPosLid = new THREE.Vector3();

            const container = document.getElementById('canvas-container');
            const initW = Math.max(container.clientWidth || window.innerWidth || 360, 1);
            const initH = Math.max(container.clientHeight || window.innerHeight || 640, 1);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance',
                alpha: false
            });
            const glCtx = renderer.getContext();
            const dbgExt = glCtx ? glCtx.getExtension('WEBGL_debug_renderer_info') : null;
            const glRendererStr = (
                (dbgExt ? String(glCtx.getParameter(dbgExt.UNMASKED_RENDERER_WEBGL) || '') : '') + ' ' +
                (glCtx ? String(glCtx.getParameter(glCtx.RENDERER) || '') : '')
            );
            const isSoftwareGl = /swiftshader|llvmpipe|software|mesa/i.test(glRendererStr);

            renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(initW, initH);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.06;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.physicallyCorrectLights = false;
            container.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030406).convertSRGBToLinear();

            const envMap = createStudioEnvironment(renderer);
            scene.environment = envMap;

            const camera = new THREE.PerspectiveCamera(36, initW / initH, 0.08, 60);

            // Iluminación de estudio de alto contraste para rojo fatuo hiperrealista y barniz líquido
            const linL = (hex) => new THREE.Color(hex).convertSRGBToLinear();
            const hemiLight = new THREE.HemisphereLight(linL(0xd4e0f8), linL(0x18080a), 0.20);
            scene.add(hemiLight);

            const keyLight = new THREE.DirectionalLight(linL(0xfff0dc), 1.18);
            keyLight.position.set(4.8, 7.2, 5.2);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.set(1024, 1024);
            keyLight.shadow.camera.near = 1.5;
            keyLight.shadow.camera.far = 20;
            const d = 3.2;
            keyLight.shadow.camera.left = -d;
            keyLight.shadow.camera.right = d;
            keyLight.shadow.camera.top = d;
            keyLight.shadow.camera.bottom = -d;
            keyLight.shadow.bias = -0.0004;
            scene.add(keyLight);

            const rimLight = new THREE.DirectionalLight(linL(0xc8deff), 1.45);
            rimLight.position.set(-5.2, 4.6, -5.8);
            scene.add(rimLight);

            const fillLight = new THREE.DirectionalLight(linL(0xffe0c4), 0.26);
            fillLight.position.set(-4.5, 2.2, 3.8);
            scene.add(fillLight);

            // Construcción del vehículo completo
            const mats = createMaterials(envMap);
            const carGroup = new THREE.Group();
            scene.add(carGroup);

            const animRefs = buildMainBody(carGroup, mats);
            buildDetailedFlat12Engine(carGroup, mats);
            buildFrontFascia(carGroup, mats);
            buildRearFascia(carGroup, mats, animRefs);
            buildSideMirrors(animRefs.doorPivots, mats);
            buildDetailedInterior(carGroup, mats);
            buildAllWheels(carGroup, mats);

            // Sombra de contacto sutil bajo las ruedas (con tenue halo de suelo oscuro)
            const shadowPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(3.4, 6.2),
                new THREE.MeshBasicMaterial({
                    map: createContactShadowTexture(),
                    transparent: true,
                    opacity: 0.85,
                    depthWrite: false
                })
            );
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.position.set(0, 0.002, -0.02);
            carGroup.add(shadowPlane);

            // -----------------------------------------------------------------
            // CONTROLADOR DE CÁMARA ORBITAL SUAVE (RATÓN + TÁCTIL + PELLIZCO)
            // -----------------------------------------------------------------
            function getDefaultRadius() {
                const w = Math.max(container.clientWidth || window.innerWidth || initW, 1);
                const h = Math.max(container.clientHeight || window.innerHeight || initH, 1);
                const aspect = w / h;
                return aspect < 0.85 ? clamp(5.3 / aspect, 5.8, 7.6) : 5.35;
            }

            const orbit = {
                theta: 0.56,
                phi: 1.24,
                radius: getDefaultRadius(),
                targetTheta: 0.56,
                targetPhi: 1.24,
                targetRadius: getDefaultRadius(),
                focus: new THREE.Vector3(0, 0.54, 0.0),
                targetFocus: new THREE.Vector3(0, 0.54, 0.0),
                isDragging: false,
                lastX: 0,
                lastY: 0,
                pinchDist: 0,
                userInteracted: false,
                guideActive: false
            };

            function guideCameraTo(theta, phi, radiusFactor, focusZ) {
                const baseR = getDefaultRadius();
                orbit.targetTheta = theta;
                orbit.targetPhi = phi;
                orbit.targetRadius = clamp(baseR * radiusFactor, 1.35, 11.0);
                orbit.targetFocus.set(0, 0.56, focusZ || 0);
                orbit.guideActive = true;
            }

            // Eventos de ratón
            const dom = renderer.domElement;
            dom.addEventListener('mousedown', (e) => {
                orbit.isDragging = true;
                orbit.userInteracted = true;
                orbit.guideActive = false;
                orbit.lastX = e.clientX;
                orbit.lastY = e.clientY;
            });
            window.addEventListener('mouseup', () => {
                orbit.isDragging = false;
            });
            window.addEventListener('mousemove', (e) => {
                if (!orbit.isDragging) return;
                const dx = e.clientX - orbit.lastX;
                const dy = e.clientY - orbit.lastY;
                orbit.lastX = e.clientX;
                orbit.lastY = e.clientY;
                orbit.targetTheta -= dx * 0.0068;
                orbit.targetPhi = clamp(orbit.targetPhi - dy * 0.0055, 0.14, 1.48);
            });
            dom.addEventListener('wheel', (e) => {
                e.preventDefault();
                orbit.guideActive = false;
                orbit.targetRadius = clamp(orbit.targetRadius * (1 + e.deltaY * 0.0011), 1.10, 12.0);
            }, { passive: false });

            // Eventos táctiles (1 dedo = rotar, 2 dedos = zoom por pellizco)
            dom.addEventListener('touchstart', (e) => {
                orbit.userInteracted = true;
                orbit.guideActive = false;
                if (e.touches.length === 1) {
                    orbit.isDragging = true;
                    orbit.lastX = e.touches[0].clientX;
                    orbit.lastY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    orbit.isDragging = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    orbit.pinchDist = Math.hypot(dx, dy);
                }
            }, { passive: true });

            dom.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && orbit.isDragging) {
                    const dx = e.touches[0].clientX - orbit.lastX;
                    const dy = e.touches[0].clientY - orbit.lastY;
                    orbit.lastX = e.touches[0].clientX;
                    orbit.lastY = e.touches[0].clientY;
                    orbit.targetTheta -= dx * 0.0078;
                    orbit.targetPhi = clamp(orbit.targetPhi - dy * 0.0062, 0.14, 1.48);
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.hypot(dx, dy);
                    if (orbit.pinchDist > 0) {
                        orbit.targetRadius = clamp(orbit.targetRadius * (orbit.pinchDist / dist), 1.10, 12.0);
                    }
                    orbit.pinchDist = dist;
                }
            }, { passive: true });

            dom.addEventListener('touchend', () => {
                orbit.isDragging = false;
                orbit.pinchDist = 0;
            });

            window.addEventListener('resize', () => {
                const w = Math.max(container.clientWidth || window.innerWidth || 360, 1);
                const h = Math.max(container.clientHeight || window.innerHeight || 640, 1);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });

            // -----------------------------------------------------------------
            // ESTADO Y EVENTOS DE LOS 3 BOTONES INTERACTIVOS
            // -----------------------------------------------------------------
            const animState = {
                doorsTarget: 0,
                doorsProg: 0,
                hoodTarget: 0,
                hoodProg: 0,
                lightsTarget: 0,
                popupProg: 0,
                lightPower: 0
            };

            const btnDoors  = document.getElementById('btn-doors');
            const btnHood   = document.getElementById('btn-hood');
            const btnLights = document.getElementById('btn-lights');

            if (btnDoors) {
                btnDoors.addEventListener('click', () => {
                    animState.doorsTarget = animState.doorsTarget ? 0 : 1;
                    const active = animState.doorsTarget === 1;
                    btnDoors.classList.toggle('active', active);
                    btnDoors.setAttribute('aria-pressed', String(active));
                    if (active) {
                        guideCameraTo(1.18, 1.14, 0.96, 0.08);
                    }
                });
            }

            if (btnHood) {
                btnHood.addEventListener('click', () => {
                    animState.hoodTarget = animState.hoodTarget ? 0 : 1;
                    const active = animState.hoodTarget === 1;
                    btnHood.classList.toggle('active', active);
                    btnHood.setAttribute('aria-pressed', String(active));
                    if (active) {
                        guideCameraTo(0.44, 1.02, 0.48, 1.40);
                    }
                });
            }

            if (btnLights) {
                btnLights.addEventListener('click', () => {
                    animState.lightsTarget = animState.lightsTarget ? 0 : 1;
                    const active = animState.lightsTarget === 1;
                    btnLights.classList.toggle('active-amber', active);
                    btnLights.setAttribute('aria-pressed', String(active));
                    if (active) {
                        guideCameraTo(0.46, 1.26, 0.88, 0.55);
                    }
                });
            }

            // Eventos de interacción también despiertan el render bajo demanda en software GL
            let renderScheduled = false;
            function requestSceneRender() {
                if (isSoftwareGl && !renderScheduled) {
                    renderScheduled = true;
                    requestAnimationFrame(animate);
                }
            }

            dom.addEventListener('mousedown', requestSceneRender);
            window.addEventListener('mousemove', () => {
                if (orbit.isDragging) requestSceneRender();
            });
            dom.addEventListener('wheel', requestSceneRender, { passive: true });
            dom.addEventListener('touchstart', requestSceneRender, { passive: true });
            dom.addEventListener('touchmove', requestSceneRender, { passive: true });
            window.addEventListener('resize', requestSceneRender);
            if (btnDoors) btnDoors.addEventListener('click', requestSceneRender);
            if (btnHood) btnHood.addEventListener('click', requestSceneRender);
            if (btnLights) btnLights.addEventListener('click', requestSceneRender);

            // -----------------------------------------------------------------
            // BUCLE PRINCIPAL DE ANIMACIÓN Y RENDERIZADO
            // -----------------------------------------------------------------
            let prevTime = performance.now();

            function animate(now) {
                renderScheduled = false;
                const rawDt = clamp((now - prevTime) * 0.001, 0, 0.05);
                const dt = isSoftwareGl ? 2.5 : rawDt;
                prevTime = now;

                // 1. Solo la puerta del conductor (side === 1) se abre; la del acompañante permanece cerrada
                animState.doorsProg = moveTowards(animState.doorsProg, animState.doorsTarget, dt * 1.15);
                const doorEase = smoothstep(0, 1, animState.doorsProg);
                for (let i = 0; i < animRefs.doorPivots.length; i++) {
                    const { pivot, side } = animRefs.doorPivots[i];
                    pivot.rotation.y = (side === 1) ? (-side * doorEase * 1.08) : 0;
                }
                if (animRefs.cabinLight) {
                    animRefs.cabinLight.intensity = lerp(0.45, 1.55, doorEase);
                }

                // 2. Capó delantero / maletero (36.6°) sobre amortiguadores reales; el capó del motor permanece cerrado
                animState.hoodProg = moveTowards(animState.hoodProg, animState.hoodTarget, dt * 1.05);
                const hoodEase = smoothstep(0, 1, animState.hoodProg);

                if (animRefs.engineLidPivot) {
                    animRefs.engineLidPivot.rotation.x = 0;
                    for (let i = 0; i < animRefs.rearStruts.length; i++) {
                        const rs = animRefs.rearStruts[i];
                        updateHydraulicStrut(rs.strut, animRefs.engineLidPivot, rs.anchorCar, rs.anchorLidLocal);
                    }
                }
                if (animRefs.hoodPivot) {
                    animRefs.hoodPivot.rotation.x = -hoodEase * 0.74;
                    for (let i = 0; i < animRefs.frontStruts.length; i++) {
                        const fs = animRefs.frontStruts[i];
                        updateHydraulicStrut(fs.strut, animRefs.hoodPivot, fs.anchorCar, fs.anchorLidLocal);
                    }
                }
                if (animRefs.engineBayLight) {
                    animRefs.engineBayLight.intensity = 1.15;
                }
                if (animRefs.trunkLight) {
                    animRefs.trunkLight.intensity = lerp(0.0, 2.25, hoodEase);
                }

                // 3. Faros escamoteables Carello + encendido secuencial de halógenos y pilotos
                animState.popupProg = moveTowards(animState.popupProg, animState.lightsTarget, dt * 1.85);
                const popupEase = smoothstep(0, 1, animState.popupProg);
                for (let i = 0; i < animRefs.headlightPivots.length; i++) {
                    animRefs.headlightPivots[i].rotation.x = -popupEase * 0.52;
                }

                const desiredLightPower = (animState.lightsTarget === 1 && animState.popupProg > 0.52) ? 1 : 0;
                const lampSpeed = desiredLightPower > 0.5 ? dt * 3.2 : dt * 4.5;
                animState.lightPower = moveTowards(animState.lightPower, desiredLightPower, lampSpeed);
                const lp = smoothstep(0, 1, animState.lightPower);

                mats.popUpBulbCore.emissiveIntensity = lp * 4.6;
                mats.popUpReflectorLit.emissiveIntensity = lp * 0.92;
                mats.popUpLensGlass.emissiveIntensity = lp * 0.42;
                mats.headlightBeam.opacity = lp * 0.11;
                mats.haloWarmSprite.opacity = lp * 0.46;
                mats.haloFogSprite.opacity = lp * 0.34;

                mats.frontFogLight.emissiveIntensity = lerp(0.06, 1.25, lp);
                mats.tailLightRed.emissiveIntensity = lerp(0.14, 2.35, lp);
                mats.amberLight.emissiveIntensity = lerp(0.08, 1.25, lp);
                mats.sideMarkerAmber.emissiveIntensity = lerp(0.08, 1.45, lp);
                mats.gaugeCluster.emissiveIntensity = lerp(0.45, 1.55, lp);
                mats.dialSpeedo.emissiveIntensity = lerp(0.55, 1.45, lp);
                mats.dialTach.emissiveIntensity = lerp(0.55, 1.45, lp);
                mats.dialOil.emissiveIntensity = lerp(0.50, 1.35, lp);
                mats.dialWater.emissiveIntensity = lerp(0.50, 1.35, lp);
                mats.dialFuel.emissiveIntensity = lerp(0.50, 1.35, lp);
                mats.dialClock.emissiveIntensity = lerp(0.50, 1.35, lp);
                mats.centerStackMat.emissiveIntensity = lerp(0.38, 1.25, lp);

                for (let i = 0; i < animRefs.headlightSpots.length; i++) {
                    animRefs.headlightSpots[i].intensity = lp * 3.4;
                }
                if (animRefs.plateLight) {
                    animRefs.plateLight.intensity = lp * 0.85;
                }

                // 4. Actualización amortiguada de cámara orbital
                if (!isSoftwareGl && !orbit.userInteracted && !orbit.guideActive) {
                    orbit.targetTheta += dt * 0.14;
                }
                if (!orbit.guideActive) {
                    // Al acercar el zoom por detrás, centrar en el V12; con el capó abierto al frente, centrar en el maletero
                    const rearProximity = clamp(-Math.cos(orbit.theta), 0, 1) * smoothstep(3.8, 2.1, orbit.targetRadius);
                    const frontTrunkFocus = animState.hoodTarget === 1 ? clamp(Math.cos(orbit.theta), 0, 1) * smoothstep(4.2, 2.4, orbit.targetRadius) : 0;
                    orbit.targetFocus.set(
                        0,
                        lerp(lerp(0.54, 0.64, rearProximity), 0.50, frontTrunkFocus),
                        lerp(lerp(0.0, -1.15, rearProximity), 1.38, frontTrunkFocus)
                    );
                }

                const damp = isSoftwareGl ? 1.0 : (1 - Math.exp(-dt * 6.5));
                orbit.theta  = lerp(orbit.theta,  orbit.targetTheta,  damp);
                orbit.phi    = lerp(orbit.phi,    orbit.targetPhi,    damp);
                orbit.radius = lerp(orbit.radius, orbit.targetRadius, damp);
                orbit.focus.lerp(orbit.targetFocus, damp);

                camera.position.set(
                    orbit.focus.x + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
                    orbit.focus.y + orbit.radius * Math.cos(orbit.phi),
                    orbit.focus.z + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
                );
                camera.lookAt(orbit.focus);

                renderer.render(scene, camera);

                if (!isSoftwareGl) {
                    requestAnimationFrame(animate);
                }
            }

            if (isSoftwareGl) {
                animate(performance.now());
            } else {
                requestAnimationFrame(animate);
            }
        }

        // Arranque seguro al cargar completamente el documento
        let appInitialized = false;
        function startApp() {
            if (appInitialized) return;
            try {
                if (typeof THREE === 'undefined') {
                    throw new Error('No se pudo cargar la librería Three.js.');
                }
                appInitialized = true;
                init();
            } catch (err) {
                const banner = document.getElementById('error-banner');
                if (banner) {
                    banner.style.display = 'block';
                    banner.textContent = 'Error al iniciar la escena 3D: ' + (err && err.message ? err.message : String(err));
                }
            }
        }

        window.onload = startApp;
        if (document.readyState === 'complete') {
            startApp();
        }
    </script>
</body>
</html>
